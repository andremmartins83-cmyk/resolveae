function checkFinancialAlert(m){
  var r=rendaT(m),d=tD(m),pct=r>0?d/r*100:0;
  if(pct<=100){hideAlert();return}
  var now=Date.now();
  if(now-alertShownAt<300000)return;
  alertShownAt=now;
  var deficit=d-r;
  var tips=['Revise despesas variáveis: restaurante, lazer e compras.','Renegocie despesas fixas: internet, celular, assinaturas.','Pause ou renegocie parcelas que puder.','Busque renda extra temporária.','Priorize essenciais: moradia, luz, água, alimentação.','Verifique se há dívidas no radar que podem esperar.','Cancele assinaturas que não usa com frequência.'];
  var sel=[];var pool=tips.slice();
  for(var i=0;i<3&&pool.length>0;i++){var ri=Math.floor(Math.random()*pool.length);sel.push(pool.splice(ri,1)[0])}
  var el=document.getElementById('alertPop');
  el.innerHTML='<div class="alert-pop"><div class="alert-pop-stripe"></div><div class="alert-pop-timer" id="alertTimer" style="width:100%"></div><div class="alert-pop-body"><div class="alert-pop-title">\u{1F6A8} Alerta Financeiro</div><div class="alert-pop-msg">Em <strong>'+MN[m]+'</strong>, suas despesas estão em <strong>'+pct.toFixed(0)+'%</strong> da renda. Você está gastando <strong>'+fm(deficit)+'</strong> a mais do que ganha.</div><div class="alert-pop-tips"><b>Recomendações:</b><br>\u{2022} '+sel.join('<br>\u{2022} ')+'</div><div class="alert-pop-close"><button onclick="hideAlert()">Entendi, vou revisar</button></div></div></div>';
  var duration=120;var start=Date.now();
  if(alertTimer)clearInterval(alertTimer);
  alertTimer=setInterval(function(){var elapsed=(Date.now()-start)/1000;var rem=Math.max(0,duration-elapsed);var bar=document.getElementById('alertTimer');if(bar)bar.style.width=(rem/duration*100)+'%';if(rem<=0)hideAlert()},500);
}

function hideAlert(){
  var el=document.getElementById('alertPop');
  if(el)el.innerHTML='';
  if(alertTimer){clearInterval(alertTimer);alertTimer=null}
}

var LANC_ENVIANDO=false;

function pad2(n){return('0'+n).slice(-2)}
function fmDia(iso){var p=String(iso||'').split('-');return p.length===3?p[2]+'/'+p[1]:'—'}

// lancamentos ja confirmados na planilha + os que ainda estao na fila de envio
function lancTodos(){
  var vis=(DB.lancamentos||[]).slice(),ids={};
  vis.forEach(function(l){ids[String(l.id)]=1});
  (DB.filaLanc||[]).forEach(function(l){if(!ids[String(l.id)])vis.push(l)});
  return vis;
}
function naFila(id){return (DB.filaLanc||[]).some(function(l){return String(l.id)===String(id)})}
function lancDoMes(ano,mes,tipo){
  return lancTodos().filter(function(l){
    return String(l.ano)===String(ano)&&Number(l.mes)===Number(mes)&&(!tipo||String(l.tipo||'despesa')===tipo);
  });
}
function somaPorCat(ano,mes,tipo){
  var mapa={};
  lancDoMes(ano,mes,tipo).forEach(function(l){var c=String(l.categoria||'—');mapa[c]=(mapa[c]||0)+(Number(l.valor)||0)});
  return mapa;
}
// realizado por categoria: lancamento manda; sem lancamento, fixa "Paga" vale o previsto
function realizado(m,tipo){
  var lista=tipo==='renda'?Y().renda:Y().despesas,mapa=somaPorCat(DB.curYear,m,tipo||'despesa'),out={};
  lista.forEach(function(it){
    if(mapa[it.name]!==undefined)out[it.name]={v:mapa[it.name],src:'lanc'};
    else if(tipo!=='renda'&&it.status&&it.status[m]==='Pago'&&it.values[m]>0)out[it.name]={v:it.values[m],src:'pago'};
    else out[it.name]={v:0,src:''};
  });
  for(var c in mapa)if(out[c]===undefined)out[c]={v:mapa[c],src:'extra'};
  return out;
}
function totalReal(m,tipo){var o=realizado(m,tipo),t=0;for(var c in o)t+=o[c].v;return t}

function dataPadrao(){
  var h=new Date();
  if(String(h.getFullYear())===String(DB.curYear)&&h.getMonth()===DB.mo)return DB.curYear+'-'+pad2(DB.mo+1)+'-'+pad2(h.getDate());
  return DB.curYear+'-'+pad2(DB.mo+1)+'-01';
}

function abrirLanc(){LC.tipo='despesa';LC.cat='';LC.extras=[];csb();om(htmlLanc());setTimeout(function(){var e=document.getElementById('lcV');if(e)e.focus()},mob()?60:140)}
function htmlLanc(){
  return '<h3>Lançar</h3><p class="ms">Entra no realizado do mês. O planejamento não muda.</p>'+
  '<div class="tgl" role="group" aria-label="Tipo de lançamento" style="margin-bottom:16px"><button class="tgl-o '+(LC.tipo==='despesa'?'on':'')+'" aria-pressed="'+(LC.tipo==='despesa')+'" onclick="lcTipo(\'despesa\')">Gasto</button><button class="tgl-o '+(LC.tipo==='renda'?'on':'')+'" aria-pressed="'+(LC.tipo==='renda')+'" onclick="lcTipo(\'renda\')">Entrada</button></div>'+
  '<div class="fd"><label for="lcV">Valor</label><input type="text" id="lcV" class="lc-val" placeholder="0,00" inputmode="decimal" autocomplete="off" enterkeyhint="next" oninput="lcBotao()" onkeydown="lcEnter(event)"></div>'+
  '<div class="fd"><label for="lcF">Categoria</label><input type="search" id="lcF" class="inp" placeholder="Buscar categoria" oninput="lcFiltrar()" autocomplete="off" enterkeyhint="search"><div class="lc-grid" id="lcG" role="listbox" aria-label="Categorias">'+catBtns()+'</div></div>'+
  '<div class="fd-row"><div class="fd"><label for="lcD">Data</label><input type="date" id="lcD" value="'+dataPadrao()+'"></div><div class="fd"><label for="lcO">Observação</label><input type="text" id="lcO" placeholder="Opcional" enterkeyhint="done" onkeydown="if(event.key===\'Enter\'){event.preventDefault();salvarLanc()}"></div></div>'+
  '<div class="mac"><button class="btn btn-s" onclick="cmo()">Cancelar</button><button class="btn btn-p" id="lcOk" onclick="salvarLanc()">Lançar</button></div>';
}
// o botao diz exatamente o que vai acontecer: "Lançar R$ 45,90"
function lcBotao(){var b=document.getElementById('lcOk'),v=lerValor((document.getElementById('lcV')||{}).value);if(b)b.textContent=v>0?'Lançar '+fm(v):'Lançar'}
function lcEnter(e){if(e.key!=='Enter')return;e.preventDefault();if(LC.cat)salvarLanc();else{var f=document.getElementById('lcF');if(f)f.focus()}}
function semAcento(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
// ordem: mais lancadas no mes > maior valor previsto no mes > alfabetica
function catBtns(){
  var m=DB.mo,base=(LC.tipo==='renda'?Y().renda:Y().despesas),usos={};
  lancDoMes(DB.curYear,m,LC.tipo).forEach(function(l){usos[l.categoria]=(usos[l.categoria]||0)+1});
  var arr=base.map(function(x){return{n:x.name,u:usos[x.name]||0,v:x.values[m]||0}}),vistos={};
  arr.forEach(function(x){vistos[x.n]=1});
  lancTodos().forEach(function(l){if(String(l.tipo||'despesa')===LC.tipo&&l.categoria&&!vistos[l.categoria]){vistos[l.categoria]=1;arr.push({n:l.categoria,u:usos[l.categoria]||0,v:0})}});
  LC.extras.forEach(function(n){if(!vistos[n]){vistos[n]=1;arr.push({n:n,u:0,v:0})}});
  arr.sort(function(a,b){if(b.u!==a.u)return b.u-a.u;if(b.v!==a.v)return b.v-a.v;return a.n.localeCompare(b.n)});
  LC.lista=arr.map(function(x){return x.n});
  var f=semAcento((document.getElementById('lcF')||{}).value||'');
  var htm=LC.lista.map(function(n,i){
    if(f&&semAcento(n).indexOf(f)<0)return '';
    var ic=gi(n);
    return '<button type="button" class="lc-cat'+(LC.cat===n?' on':'')+'" role="option" aria-selected="'+(LC.cat===n)+'" onclick="lcCat(this,'+i+')"><span class="e">'+ic[0]+'</span><span class="n">'+esc(n)+'</span></button>';
  }).join('');
  return htm+'<button type="button" class="lc-cat nova" onclick="lcNovaCat()">'+svg('plus')+'<span class="n">Outra categoria</span></button>';
}
function lcFiltrar(){document.getElementById('lcG').innerHTML=catBtns()}
function lcTipo(t){
  var v=(document.getElementById('lcV')||{}).value||'',o=(document.getElementById('lcO')||{}).value||'',d=(document.getElementById('lcD')||{}).value||'';
  LC.tipo=t;LC.cat='';LC.extras=[];om(htmlLanc());
  document.getElementById('lcV').value=v;document.getElementById('lcO').value=o;if(d)document.getElementById('lcD').value=d;lcBotao();
}
function lcCat(el,i){
  LC.cat=LC.lista[i];
  var b=el.parentElement.querySelectorAll('.lc-cat');
  for(var k=0;k<b.length;k++){b[k].classList.remove('on');b[k].setAttribute('aria-selected','false')}
  el.classList.add('on');el.setAttribute('aria-selected','true');
  var er=document.getElementById('fdErr');if(er)er.remove();
}
function lcNovaCat(){
  document.getElementById('lcG').innerHTML='<div class="lc-nc"><input type="text" id="lcNC" class="inp" placeholder="Nome da categoria" enterkeyhint="done" onkeydown="if(event.key===\'Enter\'){event.preventDefault();lcConfCat()}"><button type="button" class="btn btn-p" style="flex:0 0 auto" onclick="lcConfCat()">Usar</button></div>';
  setTimeout(function(){var e=document.getElementById('lcNC');if(e)e.focus()},60);
}
function lcConfCat(){
  var v=(document.getElementById('lcNC').value||'').trim();
  if(!v){erroCampo('lcNC','Digite o nome da categoria.');return}
  if(LC.extras.indexOf(v)<0)LC.extras.push(v);
  LC.cat=v;
  var f=document.getElementById('lcF');if(f)f.value='';
  document.getElementById('lcG').innerHTML=catBtns();
}
function salvarLanc(){
  var v=lerValor(document.getElementById('lcV').value);
  if(v===null||v<=0){erroCampo('lcV','Informe o valor (ex.: 45,90).');return}
  if(!LC.cat){erroCampo('lcF','Escolha a categoria.');return}
  var dt=document.getElementById('lcD').value||dataPadrao(),p=dt.split('-');
  if(p.length!==3){erroCampo('lcD','Data inválida.');return}
  var l={id:'l'+Date.now()+'-'+Math.floor(Math.random()*10000),data:dt,ano:String(Number(p[0])),mes:Number(p[1])-1,
    tipo:LC.tipo,categoria:LC.cat,valor:v,obs:(document.getElementById('lcO').value||'').trim(),origem:'app'};
  var noPlano=lancNoPlano(l,1);
  if(!DB.filaLanc)DB.filaLanc=[];
  DB.filaLanc.push(l);
  salvarLocal();cmo();
  toast((LC.tipo==='renda'?'Entrada lançada: ':'Gasto lançado: ')+LC.cat+' · '+fm(v)+(noPlano?' · somado ao planejamento':''),function(){desfazerLanc(l.id)});
  R();
  enviarFilaLanc();
}
// Desfazer o lancamento recem-feito usa a exclusao que ja existe. Se o envio dele estiver em curso,
// espera terminar para que a exclusao tambem chegue a planilha.
function desfazerLanc(id){
  var emEnvio=function(){return LANC_ENVIANDO&&DB.filaLanc&&DB.filaLanc[0]&&String(DB.filaLanc[0].id)===String(id)};
  if(!emEnvio()){confDelLanc(id);return}
  var n=0,t=setInterval(function(){if(!emEnvio()||++n>150){clearInterval(t);confDelLanc(id)}},200);
}
// Erro que nao melhora tentando de novo: o lancamento sai da fila com aviso (antes travava a fila para sempre)
var ERRO_LANC_PERMANENTE=/^(dados-incompletos|valor-invalido|data-invalida|categoria-invalida|payload-invalido|invalido|acao-desconhecida)/;
function tirarDaFila(id){DB.filaLanc=(DB.filaLanc||[]).filter(function(x){return String(x.id)!==String(id)})}
function enviarFilaLanc(){
  if(!KEY||!DB.filaLanc||!DB.filaLanc.length||LANC_ENVIANDO)return;
  var l=DB.filaLanc[0];
  LANC_ENVIANDO=true;
  syncUI('enviando','Salvando lançamento…');
  apiPost('addLancamento',l).then(function(r){
    LANC_ENVIANDO=false;
    if(r&&r.ok){
      // Remove POR ID: se algo foi excluido da fila durante o envio, shift() tiraria o errado
      tirarDaFila(l.id);
      if(!DB.lancamentos)DB.lancamentos=[];
      if(!DB.lancamentos.some(function(x){return String(x.id)===String(l.id)}))DB.lancamentos.push(l);
      salvarLocal();
      if(DB.filaLanc.length){enviarFilaLanc();return}
      syncUI('ok','Lançamento salvo '+hora());
      if(DB.pg==='controle')R();
    }else if(r&&r.erro&&ERRO_LANC_PERMANENTE.test(String(r.erro))){
      tirarDaFila(l.id);salvarLocal();
      syncUI('erro','Lançamento recusado pela planilha');
      avisar('Lançamento não foi salvo','A planilha recusou <strong>'+esc(l.categoria)+' · '+fm(l.valor)+' · '+fmDia(l.data)+'</strong> ('+esc(r.erro)+'). Ele saiu da fila; lance de novo se precisar.');
      if(DB.pg==='controle')R();
      if(DB.filaLanc.length)enviarFilaLanc();
    }else{
      syncUI('erro','Lançamento na fila — tentando de novo');
      setTimeout(enviarFilaLanc,20000);
    }
  }).catch(function(){
    LANC_ENVIANDO=false;
    syncUI('offline','Lançamento na fila — envio quando voltar');
    setTimeout(enviarFilaLanc,20000);
  });
}
function delLanc(id){
  var l=lancTodos().filter(function(x){return String(x.id)===String(id)})[0];
  if(!l)return;
  om('<h3>Excluir lançamento</h3><p class="ms">'+esc(l.categoria)+' · '+fm(l.valor)+' · '+fmDia(l.data)+'</p>'+
  '<div class="ins yw"><span class="em">'+svg('info')+'</span>Sai do realizado. O previsto no planejamento não muda.</div>'+
  '<div class="mac"><button class="btn btn-s" onclick="cmo()">Cancelar</button><button class="btn btn-d" id="lcDelOk">Excluir</button></div>');
  document.getElementById('lcDelOk').onclick=function(){confDelLanc(id)};
}
// Lancamento sem previsto no mes entra tambem no planejamento (antes so ia para o Controle e o Inicio nao mudava).
// Regra: o planejamento so e mexido quando o valor previsto e exatamente a soma dos lancamentos daquela categoria no mes.
function lancNoPlano(l,sinal){
  var y=DB.years[String(l.ano)];if(!y)return false;
  var renda=String(l.tipo||'despesa')==='renda',lista=renda?y.renda:y.despesas,m=Number(l.mes),n=Fin.normNome(l.categoria),it=null,i;
  for(i=0;i<lista.length;i++)if(Fin.normNome(lista[i].name)===n){it=lista[i];break}
  var outros=0;lancTodos().forEach(function(x){if(String(x.id)!==String(l.id)&&String(x.ano)===String(l.ano)&&Number(x.mes)===m&&String(x.tipo||'despesa')===String(l.tipo||'despesa')&&Fin.normNome(x.categoria)===n)outros+=Fin.c(x.valor)});
  var plano=it?Fin.c(it.values[m]||0):0,vc=Fin.c(l.valor);
  if(sinal>0){
    if(plano!==outros)return false;
    if(!it){it=renda?{id:novoId('r'),name:l.categoria,tipo:'variavel',values:z12()}:{id:novoId('d'),name:l.categoria,venc:'',tipo:'variavel',values:z12(),status:s12()};lista.push(it)}
    it.values[m]=Fin.r(plano+vc);if(!renda)it.status[m]='Pago';return true}
  if(!it||plano!==outros+vc)return false;
  it.values[m]=Fin.r(outros);if(!renda&&outros===0&&it.status[m]==='Pago')it.status[m]='';return true}
function confDelLanc(id){
  var estavaNaFila=naFila(id),lx=null;lancTodos().forEach(function(x){if(String(x.id)===String(id))lx=x});
  if(lx)lancNoPlano(lx,-1);
  DB.lancamentos=(DB.lancamentos||[]).filter(function(x){return String(x.id)!==String(id)});
  DB.filaLanc=(DB.filaLanc||[]).filter(function(x){return String(x.id)!==String(id)});
  salvarLocal();cmo();toast('Lançamento excluído');R();
  if(KEY&&!estavaNaFila)apiPost('delLancamento',{id:id}).catch(function(){});
}

// ===== PAGINA CONTROLE — previsto x realizado =====
function pgCtrl(m){
  var real=realizado(m,'despesa'),linhas=[];
  Y().despesas.forEach(function(d){
    var pv=d.values[m]||0,o=real[d.name]||{v:0,src:''};
    if(pv<=0&&o.v<=0)return;
    linhas.push({n:d.name,p:pv,r:o.v,src:o.src});
  });
  for(var c in real)if(real[c].src==='extra')linhas.push({n:c,p:0,r:real[c].v,src:'extra'});
  // parcelas de divida: previsto = parcela, realizado = pago na competencia
  var pagoParc=0;
  PM(m).forEach(function(p){pagoParc+=Fin.c(p.pago||0);linhas.push({n:nomeParc(p.name),p:p.valor,r:p.pago||0,src:'parcela'})});
  // quem estourou vem primeiro (maior estouro no topo); o resto por maior valor
  linhas.sort(function(a,b){
    var ea=a.r>a.p?1:0,eb=b.r>b.p?1:0;
    if(ea!==eb)return eb-ea;
    if(ea)return (b.r-b.p)-(a.r-a.p);
    return Math.max(b.p,b.r)-Math.max(a.p,a.r);
  });
  var tp=tD(m),tr=Fin.r(Fin.c(totalReal(m,'despesa'))+pagoParc),df=Fin.r(Fin.c(tp)-Fin.c(tr));
  var rp=tR(m),rr=totalReal(m,'renda'),mes=MN[m].toLowerCase(),nl=lancDoMes(DB.curYear,m,'despesa').length;

  var h='<div class="pg on"><div class="ph"><div class="pt">Controle<small>Previsto x realizado · '+MN[m]+' '+esc(DB.curYear)+'</small></div><button class="ab" onclick="abrirLanc()">'+svg('bolt')+'Lançar</button></div>';
  h+='<div class="stats c3">'+
    '<div><div class="sx-l">Previsto</div><div class="sx-v">'+fm(tp)+'</div><div class="sx-s">'+plural(Y().despesas.filter(function(x){return x.values[m]>0}).length,'conta planejada','contas planejadas')+'</div></div>'+
    '<div><div class="sx-l">Realizado</div><div class="sx-v">'+fm(tr)+'</div><div class="sx-s">'+plural(nl,'lançamento')+' + fixas pagas</div></div>'+
    '<div><div class="sx-l">Diferença</div><div class="sx-v '+(df>=0?'ok':'al')+'">'+fm(df)+'</div><div class="sx-s">'+(df>=0?'dentro do previsto':'acima do previsto')+'</div></div>'+
  '</div>';
  if(df<0)h+='<div class="ins al"><span class="em">'+svg('alert')+'</span>Gastou <strong>'+fm(-df)+'</strong> acima do que planejou para '+mes+'.</div>';
  if(rr>0)h+='<div class="ins"><span class="em">'+svg('info')+'</span>Entradas lançadas: <strong>'+fm(rr)+'</strong> · renda prevista: <strong>'+fm(rp)+'</strong></div>';

  h+='<section class="tc"><div class="tc-h"><h2>Por categoria</h2><span class="card-m">'+plural(linhas.length,'item','itens')+'</span></div>';
  if(linhas.length){
    h+='<div class="ct-hd"><span>Categoria</span><span>Previsto</span><span>Realizado</span><span>Diferença</span></div>';
    linhas.forEach(function(l){
      var pct=l.p>0?l.r/l.p*100:(l.r>0?100:0),cls=l.p<=0&&l.r>0?'bd':pct>100.5?'bd':pct>90&&pct<99.5?'wn':'ok',d2=l.p-l.r,ic=gi(l.n);
      var tag=l.src==='parcela'?'<span class="ct-tag">dívida</span>':l.src==='pago'?'<span class="ct-tag">fixa paga</span>':l.src==='extra'?'<span class="ct-tag ex">fora do previsto</span>':'';
      h+='<div class="ct-row"><div class="ct-nm"><span class="ic">'+ic[0]+'</span><span class="tx">'+esc(l.n)+'</span>'+tag+'</div>'+
        '<div class="ct-v mu" data-l="Previsto">'+fm(l.p)+'</div>'+
        '<div class="ct-v" data-l="Realizado">'+fm(l.r)+'</div>'+
        '<div class="ct-v '+(d2<0?'al':d2>0?'ok':'ze')+'" data-l="Diferença">'+fm(d2)+'</div>'+
        '<div class="ct-bar"><div class="ct-fill '+cls+'" style="width:'+Math.min(pct,100).toFixed(1)+'%"></div></div></div>';
    });
  }else h+='<div class="vazio">'+svg('list')+'<b>Nada previsto nem lançado em '+mes+'</b>Os lançamentos do ⚡ aparecem aqui.</div>';
  h+='</section>';

  var ls=lancDoMes(DB.curYear,m).slice().sort(function(a,b){return String(b.data).localeCompare(String(a.data))});
  h+='<section class="tc"><div class="tc-h"><h2>Lançamentos de '+mes+(ls.length?' <span class="tcb">'+ls.length+'</span>':'')+'</h2></div>';
  if(ls.length){
    ls.forEach(function(l){
      var ic=gi(l.categoria),rd=String(l.tipo||'despesa')==='renda';
      h+='<div class="lg-item"><span class="lg-dt">'+fmDia(l.data)+'</span><span class="ic">'+ic[0]+'</span>'+
        '<div style="min-width:0;flex:1 1 auto"><div class="lg-nm">'+esc(l.categoria)+(naFila(l.id)?'<span class="lg-fila">na fila</span>':'')+'</div>'+
        (l.obs?'<div class="lg-ob">'+esc(l.obs)+'</div>':'')+'</div>'+
        '<span class="lg-vl '+(rd?'r':'d')+'">'+(rd?'+ ':'')+fm(l.valor)+'</span>'+
        '<button class="lg-x" data-acao="lanc-del" data-id="'+esc(String(l.id))+'" title="Excluir" aria-label="Excluir lançamento '+esc(l.categoria)+'">'+svg('x')+'</button></div>';
    });
  }else h+='<div class="vazio">'+svg('bolt')+'<b>Nenhum lançamento em '+mes+'</b>Toque em Lançar para registrar um gasto ou uma entrada.</div>';
  h+='</section></div>';
  return h;
}

// ===== BOOT =====
if(API_TESTE){var sbb=document.querySelector('.sb-br');if(sbb)sbb.insertAdjacentHTML('beforeend','<span class="teste-tag" id="tagTeste">API de teste</span>')}
R();                    // desenha na hora, com a copia local (sem enviar nada)
// Critico 1 (apagao de agosto): o que o aparelho ja tinha NAO conta como alteracao.
// Antes ultimoEnviado nascia vazio e qualquer desenho antes da nuvem virava "alterou offline".
SYNC.ultimoEnviado=assinatura();
BOOTANDO=false;
if(KEY){
  puxarDaNuvem().then(function(){enviarFilaLanc()});   // busca a planilha e escoa lancamentos parados
}else{
  syncUI('offline','Sem chave — toque para conectar');
  setTimeout(pedirChave,400);   // primeira abertura no celular: pede a chave
}

// Service worker: deixa o app abrir sem internet e instalar na tela inicial
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

// Voltou a internet: manda o que estiver na fila
window.addEventListener('online',function(){
  enviarFilaLanc();
  if(assinatura()!==SYNC.ultimoEnviado)enviarAgora();else puxarDaNuvem(true);
});
window.addEventListener('offline',function(){syncUI('offline','Offline — salvando aqui')});

// Voltou para o app (trocou de aba / desbloqueou o celular): confere a planilha
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  enviarFilaLanc();
  if(assinatura()!==SYNC.ultimoEnviado)enviarAgora();else puxarDaNuvem(true);
});

// Nao deixa sair com alteracao pendente sem avisar
window.addEventListener('beforeunload',function(e){
  if(KEY&&(assinatura()!==SYNC.ultimoEnviado||(DB.filaLanc&&DB.filaLanc.length))){e.preventDefault();e.returnValue=''}
});
</script>
