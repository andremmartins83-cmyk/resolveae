<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Resolve Aê</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#313E27">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resolve Aê">
<!-- SheetJS (xlsx) agora carrega sob demanda, so ao abrir Importar: nao trava a abertura do app -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Resolve Aê v7 (14/11): camada de apresentacao.
   Identidade: Creato Display no texto, JetBrains Mono so em numero, verde militar #313E27,
   fundo branco, apoio #F1F2ED, vermelho e ambar sobrios. Sem gradiente.
   Movimento: so transform e opacity, 120 a 320 ms, curva (.2,0,0,1); reduced-motion desliga. */
@font-face{font-family:'Creato Display';src:url('CreatoDisplay-Regular.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Creato Display';src:url('CreatoDisplay-Medium.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'Creato Display';src:url('CreatoDisplay-Medium.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'Creato Display';src:url('CreatoDisplay-Black.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'Creato Display';src:url('CreatoDisplay-Black.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'Creato Display';src:url('CreatoDisplay-Black.otf') format('opentype');font-weight:900;font-display:swap}
:root{
 --bg:#FFFFFF;--ap:#F1F2ED;--ap2:#F7F7F4;--wh:#FFFFFF;--bd:#DFE0DA;--bl:#ECEDE7;--tx:#141414;--t2:#5F605A;--t3:#8C8D86;--t4:#C4C5BE;
 /* verde militar = cor da marca (os nomes antigos azul/roxo apontam para oliva) */
 --b50:#EFF1EB;--b4:#8E9C7E;--b5:#4E6039;--b6:#313E27;--p50:#EFF1EB;--p5:#4E6039;--p6:#313E27;
 --g50:#EFF1EB;--g4:#8E9C7E;--g5:#5C7043;--g6:#41522F;--g7:#313E27;
 --r50:#FAEEEC;--r4:#C4715F;--r5:#A63D28;--r6:#8C3220;
 --o50:#FAF3E6;--o4:#C99A45;--o5:#A87C26;--o6:#8A651C;--y4:#C99A45;
 --sb:244px;--hd:60px;--tabh:58px;--rad:14px;--rs:10px;--rx:6px;
 --s1:0 1px 2px rgba(20,20,20,.06);--s2:0 6px 20px rgba(20,20,20,.08);--s3:0 18px 48px rgba(20,20,20,.18);
 --ease:cubic-bezier(.2,0,0,1);--ease-in:cubic-bezier(.3,0,1,1);--d1:120ms;--d2:200ms;--d3:320ms;
 --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Creato Display',-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;color:inherit}
::selection{background:var(--b6);color:#fff}
:focus{outline:none}
:focus-visible{outline:2px solid var(--b5);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.i .f{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== toque: resposta imediata, so transform ===== */
.btn,.ab,.dv-btn,.chk,.st,.fpill,.tgl-o,.ms-b,.lc-cat,.sb-lk,.tab-i,.ma2,.mp,.hd-r,.hd-sync,.yr-sel button,.mnu-i,.fab,.tst-u,.sb-sync button,.lg-x,.cv,.lk{transition:transform var(--d1) var(--ease),background-color var(--d1) var(--ease),border-color var(--d1) var(--ease),color var(--d1) var(--ease),opacity var(--d1) var(--ease);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn:active,.ab:active,.dv-btn:active,.st:active,.fpill:active,.tgl-o:active,.ms-b:active,.lc-cat:active,.ma2:active,.mp:active,.hd-r:active,.hd-sync:active,.yr-sel button:active,.mnu-i:active,.tst-u:active,.sb-sync button:active,.lg-x:active,.cv:active,.lk:active{transform:scale(.97)}
.chk:active .ring{transform:scale(.88)}
.fab:active{transform:scale(.92)}

/* ===== menu lateral (desktop) ===== */
.sb{position:fixed;top:0;left:0;width:var(--sb);height:100vh;background:var(--wh);border-right:1px solid var(--bl);display:flex;flex-direction:column;z-index:200;padding-top:var(--sat)}
.sb-br{padding:22px 20px 16px}
.sb-br h1{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--b6)}
.sb-br small{font-size:11.5px;color:var(--t3);font-weight:500;display:block;margin-top:2px}
.yr-sel{display:flex;align-items:center;gap:6px;margin-top:14px}
.yr-sel button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--wh);cursor:pointer;font-size:15px;color:var(--t2);display:flex;align-items:center;justify-content:center}
.yr-sel button:hover{border-color:var(--t3);color:var(--tx)}
.yr-sel button:disabled{opacity:.3;cursor:default}
.yr-sel .yr-l{font-family:var(--mono);font-size:15px;font-weight:700;flex:1;text-align:center}
.yr-sel .yr-a{width:auto;padding:0 10px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--t2)}
.teste-tag{display:inline-block;margin-top:10px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--o50);color:var(--o6);padding:3px 8px;border-radius:5px}
.sb-nav{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.sb-lk{display:flex;align-items:center;gap:11px;padding:0 12px;min-height:38px;border-radius:var(--rs);cursor:pointer;border:none;background:0;font-size:14px;font-weight:500;color:var(--t2);width:100%;text-align:left}
.sb-lk:hover{background:var(--ap);color:var(--tx)}
.sb-lk.on{background:var(--b6);color:#fff}
.sb-lk svg{width:19px;height:19px;flex-shrink:0}
.sb-bg{background:var(--r5);color:#fff;font-size:10.5px;font-weight:700;min-width:20px;height:20px;line-height:20px;padding:0 6px;border-radius:10px;margin-left:auto;font-family:var(--mono);text-align:center}
.sb-lk.on .sb-bg{background:rgba(255,255,255,.22)}
.sb-dv{height:1px;background:var(--bl);margin:8px 12px}
.sb-sync{padding:10px 12px;border-top:1px solid var(--bl);display:flex;gap:6px}
.sb-sync button{flex:1;min-height:36px;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--wh);color:var(--t2);display:flex;align-items:center;justify-content:center;gap:6px}
.sb-sync button:hover{border-color:var(--t3);color:var(--tx)}
.sb-sync .i{width:16px;height:16px}
.sb-ft{padding:12px 18px calc(14px + var(--sab));border-top:1px solid var(--bl);font-size:11.5px;color:var(--t2);display:flex;align-items:center;gap:8px;cursor:pointer}
.sb-ft:hover{background:var(--ap2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g5);flex-shrink:0}
.dot.wn{background:var(--o4);animation:pulso 1.4s var(--ease) infinite}.dot.er{background:var(--r5)}.dot.of{background:var(--t4)}
@keyframes pulso{50%{opacity:.35}}
.sbo{display:none;position:fixed;inset:0;background:rgba(20,22,18,.32);z-index:199}
.sbo.on{display:block;animation:fadeIn var(--d2) var(--ease)}

/* ===== cabecalho ===== */
.mn{margin-left:var(--sb);min-height:100vh}
.hd{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;height:calc(var(--hd) + var(--sat));padding:var(--sat) calc(28px + var(--sar)) 0 calc(28px + var(--sal));background:rgba(255,255,255,.88);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--bl)}
.hb{display:none}
.mps{display:flex;gap:2px;background:var(--ap);border-radius:var(--rs);padding:3px}
.mp{padding:0 11px;height:30px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;border:none;background:0;color:var(--t2)}
.mp:hover{color:var(--tx)}
.mp.on{background:var(--wh);color:var(--tx);font-weight:700;box-shadow:var(--s1)}
.mp.hj:not(.on){color:var(--b5);font-weight:700}
.ma2{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--wh);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.ma2:hover{border-color:var(--t3);color:var(--tx)}
.ma2 .i{width:18px;height:18px}
.hd-r{margin-left:auto;background:0;border:none;cursor:pointer;padding:0 10px;height:36px;border-radius:var(--rs);font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:6px}
.hd-r:hover{background:var(--ap)}
.hd-r .i{width:14px;height:14px;color:var(--t3)}
.hd-sync{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--wh);border-radius:999px;padding:0 12px;height:34px;cursor:pointer;font-size:12px;font-weight:600;color:var(--t2);max-width:260px}
.hd-sync:hover{border-color:var(--t3)}
.hd-sync .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-sync[data-estado="erro"]{border-color:var(--r4);color:var(--r6);background:var(--r50)}

/* ===== conteudo ===== */
.ct{padding:28px 32px 56px;max-width:1200px;margin:0 auto}
.ct.ct-l{max-width:1720px}
.pg{display:none}.pg.on{display:block}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:18px;flex-wrap:wrap}
.pt{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:18px}
.ph .pt{margin-bottom:0}
.pt small{display:block;font-size:13px;font-weight:500;color:var(--t2);letter-spacing:0;margin-top:4px}
.eyb{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)}

/* Painel do mes (Dashboard) */
.hero{border:1px solid var(--bl);border-radius:var(--rad);background:var(--wh);padding:22px 26px 0;margin-bottom:20px;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px 32px;flex-wrap:wrap}
.hero-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:44px;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin-top:8px;color:var(--b6);white-space:nowrap}
.hero-v.neg{color:var(--r5)}.hero-v.zero{color:var(--t3)}
.hero-s{font-size:13.5px;color:var(--t2);margin-top:8px;max-width:520px}
.hero-s strong{color:var(--tx);font-weight:600}
.hero-s .al{color:var(--r6)}
.hero-k{display:flex;gap:12px 36px;flex-wrap:wrap}
.kpi{text-align:right;min-width:120px}
.kpi-v{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:6px;white-space:nowrap}
.kpi-v.al{color:var(--r5)}.kpi-v.wn{color:var(--o5)}.kpi-v.ok{color:var(--b6)}
.kpi-s{display:block;font-size:12px;color:var(--t2);margin-top:2px}
.regua{position:relative;display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--ap);margin:22px 0 10px}
.regua i{display:block;height:100%;flex-shrink:0}
.rg-d{background:var(--b6)}.rg-p{background:var(--b4)}.rg-x{background:var(--r5)}
.regua-l{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px;color:var(--t2);margin-bottom:18px}
.regua-l span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.regua-l b{font-family:var(--mono);font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block}
.sw.d{background:var(--b6)}.sw.p{background:var(--b4)}.sw.s{background:var(--ap);box-shadow:inset 0 0 0 1px var(--bd)}.sw.x{background:var(--r5)}

/* faixa de numeros (painel, dividas, controle) */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--bl);border-radius:var(--rad);background:var(--wh);margin-bottom:20px;overflow:hidden}
.stats.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stats>div{padding:15px 20px;border-left:1px solid var(--bl);min-width:0}
.stats>div:first-child{border-left:0}
.hero .stats{border:0;border-top:1px solid var(--bl);border-radius:0;margin:0 -26px;background:0}
.hero .stats>div{padding:14px 26px}
.sx-l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;letter-spacing:-.03em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sx-v.al{color:var(--r6)}.sx-v.ok{color:var(--g6)}.sx-v.wn{color:var(--o6)}.sx-v.mu{color:var(--t3)}
.sx-s{font-size:12px;color:var(--t2);margin-top:2px;line-height:1.35}

/* colunas do painel */
.g3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}

/* cartao + lista */
.card,.tc{background:var(--wh);border:1px solid var(--bl);border-radius:var(--rad);margin-bottom:20px;overflow:hidden}
.card-h,.tc-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--bl);min-height:58px;flex-wrap:wrap}
.card-h h2,.tc-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-m{font-size:12.5px;color:var(--t2);white-space:nowrap}
.card-m b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx);font-weight:600}
.tcb{font-size:11px;font-weight:700;min-width:22px;height:20px;line-height:20px;padding:0 7px;border-radius:10px;font-family:var(--mono);text-align:center;background:var(--ap);color:var(--t2)}
.br2{background:var(--r50);color:var(--r6)}
.lst{list-style:none}
.row{display:flex;align-items:center;border-bottom:1px solid var(--bl);transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
.row:last-child{border-bottom:0}
.row.saindo{opacity:0;transform:translateX(16px)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;background:0;border:0;text-align:left;cursor:pointer;min-height:60px;font-size:14px;transition:background-color var(--d1) var(--ease)}
.row-main:hover{background:var(--ap2)}
.row-main:active{background:var(--ap)}
.row-tx{flex:1;min-width:0}
.row-t{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{display:block;font-size:12px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s .al{color:var(--r6);font-weight:600}
.row-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600;white-space:nowrap;text-align:right;flex-shrink:0}
.row-v small{display:block;font-size:11px;color:var(--t3);font-weight:500;margin-top:1px}
.row-v.mu{color:var(--t3)}.row-v.po{color:var(--g6)}
.row-end{width:52px;flex-shrink:0;display:flex;justify-content:center}
.row.pago .row-t{color:var(--t2)}
.chk{width:48px;height:48px;border-radius:50%;border:0;background:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--b6)}
.ring{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--t4);display:flex;align-items:center;justify-content:center;transition:transform var(--d1) var(--ease),background-color var(--d2) var(--ease),border-color var(--d2) var(--ease)}
.ring .i{width:15px;height:15px;stroke-width:2.6;opacity:0;transform:scale(.5);transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease)}
.chk:hover .ring{border-color:var(--b5)}
.chk:hover .ring .i{opacity:.4;transform:none}
.chk.feito .ring,.ring.ok{background:var(--b6);border-color:var(--b6)}
.chk.feito .ring .i,.ring.ok .i{opacity:1;transform:none;color:#fff}
.ring.ok{width:22px;height:22px;background:var(--b50);border-color:var(--b50)}
.ring.ok .i{color:var(--b6);width:13px;height:13px}
.ring.pa{border-color:var(--o4);border-style:dashed}
.na{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.04em}
.grp{border-top:1px solid var(--bl)}
.grp>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:0 18px;min-height:52px;cursor:pointer;font-size:13px;font-weight:700;color:var(--t2);background:var(--ap2)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .i{width:16px;height:16px;transition:transform var(--d2) var(--ease)}
.grp[open]>summary .i{transform:rotate(90deg)}
.grp>summary .card-m{margin-left:auto;font-weight:500}
.grp>summary:hover{color:var(--tx)}
.lst-f{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--bl);background:var(--ap2);font-size:12.5px;color:var(--t2)}
.lst-f b{font-family:var(--mono);color:var(--tx);font-size:14px;font-variant-numeric:tabular-nums}
.vazio{padding:36px 20px;text-align:center;color:var(--t2);font-size:13px}
.vazio .i{width:30px;height:30px;color:var(--b5);margin:0 auto 10px;stroke-width:1.6}
.vazio b{display:block;color:var(--tx);font-size:15px;font-weight:700;margin-bottom:3px}
.vazio .btn{margin-top:16px;flex:0 0 auto;display:inline-flex}
.lk{background:0;border:0;color:var(--b5);font-size:13px;font-weight:600;cursor:pointer;padding:6px 4px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.lk:hover{color:var(--b6);text-decoration:underline;text-underline-offset:3px}
.lk .i{width:15px;height:15px}

/* icone de categoria (emoji em fundo neutro unico) */
.ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--ap)}
.i-mr,.i-tr,.i-al,.i-sa,.i-ed,.i-lz,.i-fn,.i-sv,.i-ps,.i-ot,.i-ac,.i-rn{background:var(--ap)}

/* avisos em linha */
.ins{position:relative;display:block;padding:12px 16px 12px 44px;border-radius:var(--rs);background:var(--ap);font-size:13px;line-height:1.55;color:var(--t2);margin-bottom:16px}
.ins .em{position:absolute;left:15px;top:11px;font-size:15px;line-height:1.4}
.ins .em .i{width:18px;height:18px;margin-top:1px}
.ins strong{color:var(--tx);font-weight:700}
.ins.al{background:var(--r50);color:var(--r6)}.ins.al strong{color:var(--r6)}
.ins.gd{background:var(--g50)}.ins.gd .em{color:var(--g6)}
.ins.yw{background:var(--o50)}.ins.yw strong{color:var(--o6)}.ins.yw .em{color:var(--o6)}
.ins .ab,.ins .lk{float:right;margin:-5px -6px -5px 10px}

/* botoes */
.btn{flex:1;min-height:42px;padding:0 16px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn-p{background:var(--b6);color:#fff}.btn-p:hover{background:#26311E}
.btn-s{background:var(--ap);color:var(--tx)}.btn-s:hover{background:#E6E7E1}
.btn-d{background:var(--r50);color:var(--r6)}.btn-d:hover{background:#F4DFDB}
.btn-g{background:0;color:var(--r6);flex:0 0 auto;padding:0 10px}.btn-g:hover{background:var(--r50)}
.btn .i{width:18px;height:18px}
.ab{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--bd);border-radius:999px;background:var(--wh);color:var(--tx);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.ab:hover{border-color:var(--b5);color:var(--b6)}
.ab .i{width:16px;height:16px}

/* filtros e alternadores */
.fpills{display:inline-flex;gap:2px;background:var(--ap);border-radius:var(--rs);padding:3px;flex-wrap:wrap}
.fpill{min-height:30px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;border:0;background:0;color:var(--t2);white-space:nowrap}
.fpill:hover{color:var(--tx)}
.fpill.on{background:var(--wh);color:var(--tx);box-shadow:var(--s1)}
.tgl{display:flex;gap:2px;background:var(--ap);border-radius:var(--rs);padding:3px}
.tgl-o{flex:1;min-height:36px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:0;background:0;color:var(--t2);text-align:center;white-space:nowrap}
.tgl-o:hover{color:var(--tx)}
.tgl-o.on{background:var(--wh);color:var(--tx);box-shadow:var(--s1)}

/* tabela anual (desktop) */
.ts{overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--bd) transparent;-webkit-overflow-scrolling:touch}
.ts::-webkit-scrollbar{height:6px}.ts::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{padding:9px 10px;text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);background:var(--ap2);border-bottom:1px solid var(--bl);white-space:nowrap}
table.t th.r,table.t td.r{text-align:right}
table.t th.c,table.t td.c{text-align:center}
table.t td{padding:6px 10px;border-bottom:1px solid var(--bl);vertical-align:middle;white-space:nowrap}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr:hover td{background:var(--ap2)}
table.t tr.tot td{background:var(--ap2);font-weight:700;border-top:1px solid var(--bd)}
table.t td.tt,table.t th.tt{background:var(--ap2);font-weight:700}
.yt th,.yt td{padding:5px 8px;min-width:96px}
.yt .cn{min-width:210px;max-width:260px;position:sticky;left:0;background:var(--wh);z-index:2;box-shadow:1px 0 0 var(--bl)}
.yt th.cn{background:var(--ap2);z-index:3}
.yt tbody tr:hover .cn{background:var(--ap2)}
.yt .cn .nm span:last-child{overflow:hidden;text-overflow:ellipsis}
.nm{display:flex;align-items:center;gap:10px;font-weight:500;min-width:0}
.nm .ic{width:28px;height:28px;border-radius:8px;font-size:13px}
.cv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:12.5px;cursor:pointer;padding:5px 7px;border-radius:var(--rx);display:inline-block}
.cv:hover{background:var(--b50)}
.cv.po{color:var(--g6)}.cv.ne{color:var(--tx)}.cv.ze{color:var(--t4)}.cv.b{font-weight:700;cursor:default}.cv.b:hover{background:0}
.vc{font-size:12px;color:var(--t2)}
.tp{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;background:var(--ap);color:var(--t2)}
.tp-f{background:var(--b50);color:var(--b6)}.tp-v{background:var(--o50);color:var(--o6)}.tp-dv{background:var(--ap);color:var(--t2)}.tp-x{background:var(--o4);color:var(--t2)}
tr.sep td{background:var(--bl);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 14px}
tr.enc td{opacity:.62}.enc-t{display:block;font-size:11px;font-weight:400;opacity:.8}.hx{display:block;margin-top:4px;opacity:.85}
.mhi{background:rgba(49,62,39,.035)!important}.mhh{background:var(--b50)!important;color:var(--b6)!important}
tr.dv-linha td,tr.dv-linha td.cn{background:#FBFBF8}
tr.auto td,tr.auto td.cn{background:var(--b50)}
/* chip de status na grade */
.st{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:600;min-height:30px;min-width:84px;padding:0 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;background:0}
.st-p{background:0;color:var(--b6)}
.st-pe{background:var(--wh);color:var(--r6);border-color:var(--r4)}
.st-pe::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--r5)}
.st-pe:hover{background:var(--r50)}
.st-pa{background:var(--o50);color:var(--o6);border-color:var(--o4)}
.st-n{background:0;color:var(--t3)}
.st-e{background:0;color:var(--tx)}.st-e:hover,.st-n:hover,.st-p:hover{border-color:var(--bd)}
.st-z{color:var(--t4)}

/* destaque do elemento que acabou de mudar (aplicado depois de pintar) */
.flash{position:relative}
.flash::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--b5);opacity:0;pointer-events:none;animation:flash 640ms var(--ease)}
@keyframes flash{15%{opacity:.18}100%{opacity:0}}
.st.flash,.cv.flash,.dv-n.flash{animation:pop var(--d3) var(--ease)}
@keyframes pop{40%{transform:scale(1.06)}}

/* graficos */
.chg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.ch{background:var(--wh);border-radius:var(--rad);border:1px solid var(--bl);padding:18px 20px}
.ch.fw{grid-column:1/-1}
.cht{font-size:15px;font-weight:700;margin-bottom:14px}
.bars{display:flex;flex-direction:column;gap:6px}
.br{display:flex;align-items:center;gap:10px}
.bl2{font-size:11.5px;font-weight:500;color:var(--t2);width:30px;text-align:right;flex-shrink:0}
.bl2.hl{color:var(--tx);font-weight:800}
.bt{flex:1;height:14px;background:var(--ap);border-radius:4px;overflow:hidden;position:relative}
.bf{height:100%;border-radius:4px;position:absolute;top:0;left:0}
.bf.g{background:var(--b5)}.bf.r{background:var(--r4)}.bf.p{background:var(--b4)}
.bv{font-family:var(--mono);font-size:11.5px;font-weight:600;width:76px;text-align:right;flex-shrink:0}
.bv.g{color:var(--g6)}.bv.r{color:var(--r6)}
.leg{display:flex;gap:18px;margin-top:14px;justify-content:center}
.leg span{font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--t2)}
.ld{width:10px;height:10px;border-radius:3px;display:inline-block}
.bp{margin-bottom:4px}

/* modal: no desktop centralizado, no celular folha que sobe de baixo */
.mo{display:none;position:fixed;inset:0;background:rgba(20,22,18,.34);z-index:500;align-items:center;justify-content:center;padding:24px}
.mo.on{display:flex;animation:fadeIn var(--d2) var(--ease)}
.mo.fechando{animation:fadeOut 160ms var(--ease-in) forwards;pointer-events:none}
.md{position:relative;background:var(--wh);border-radius:16px;padding:24px;width:460px;max-width:100%;box-shadow:var(--s3);max-height:min(88vh,880px);overflow-y:auto;overscroll-behavior:contain;animation:modalIn var(--d2) var(--ease)}
.mo.fechando .md{animation:modalOut 160ms var(--ease-in) forwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes modalOut{to{opacity:0;transform:scale(.98)}}
.grab{display:none}
.md h3{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;padding-right:8px}
.md .ms{font-size:13px;color:var(--t2);margin:4px 0 18px;line-height:1.5}
.md-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.md-top .lk{margin-top:-4px;flex-shrink:0}
.fd{margin-bottom:14px}
.fd label{display:block;font-size:12px;font-weight:700;color:var(--t2);margin-bottom:6px}
.fd input,.fd select,.fd textarea,.inp{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--bd);border-radius:var(--rs);font-size:15px;outline:none;background:var(--wh);transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.fd textarea{resize:vertical;min-height:72px}
.fd input:focus,.fd select:focus,.fd textarea:focus,.inp:focus{border-color:var(--b5);box-shadow:0 0 0 3px rgba(49,62,39,.12)}
.fd-h{font-size:12px;color:var(--t2);margin-top:6px;line-height:1.5}
.fd-err{font-size:13px;color:var(--r6);background:var(--r50);border-radius:var(--rs);padding:9px 12px;margin-bottom:14px;line-height:1.5}
.fd-row{display:flex;gap:10px}.fd-row>*{flex:1;min-width:0}
.mac{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.mac .btn-g{margin-right:auto}
.resumo{display:flex;gap:0;border:1px solid var(--bl);border-radius:var(--rs);margin-bottom:16px;overflow:hidden}
.resumo>div{flex:1;padding:12px 14px;border-left:1px solid var(--bl);min-width:0}
.resumo>div:first-child{border-left:0}
.resumo .sx-v{font-size:17px}
.mnu-sheet{display:flex;flex-direction:column;border:1px solid var(--bl);border-radius:var(--rs);overflow:hidden;margin-top:14px}
.mnu-i{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 16px;border:0;border-bottom:1px solid var(--bl);background:var(--wh);font-size:15px;font-weight:500;text-align:left;cursor:pointer}
.mnu-i:last-child{border-bottom:0}
.mnu-i:hover{background:var(--ap2)}
.mnu-i .i{width:18px;height:18px;color:var(--t2)}
.mnu-i.perigo,.mnu-i.perigo .i{color:var(--r6)}
/* menu flutuante (desktop) */
.pop{position:absolute;z-index:450;min-width:220px;background:var(--wh);border:1px solid var(--bl);border-radius:12px;box-shadow:var(--s3);padding:6px;transform-origin:top right;animation:popIn 160ms var(--ease)}
.pop.acima{transform-origin:bottom right}
.pop .mnu-i{min-height:40px;border:0;border-radius:8px;font-size:14px;padding:0 12px}
.pop .mnu-sep{height:1px;background:var(--bl);margin:5px 6px}
@keyframes popIn{from{opacity:0;transform:scale(.96)}}

/* toast: mensagem curta, com Desfazer quando a acao tem volta */
.tst{position:fixed;left:50%;bottom:calc(24px + var(--sab));z-index:999;display:flex;align-items:center;gap:12px;width:max-content;max-width:min(520px,calc(100vw - 32px));background:#1D2119;color:#fff;padding:0 18px;min-height:48px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:var(--s3);transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:transform var(--d2) var(--ease),opacity var(--d2) var(--ease)}
.tst.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.tst.u{padding-right:6px}
.tst-m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tst-u{background:0;border:0;color:#CFDCB8;font-size:14px;font-weight:700;padding:0 12px;min-height:40px;border-radius:9px;cursor:pointer;flex-shrink:0}
.tst-u:hover{background:rgba(255,255,255,.1)}

/* botao de lancamento rapido (desktop) */
.fab{position:fixed;right:28px;bottom:calc(28px + var(--sab));width:56px;height:56px;border-radius:50%;border:none;background:var(--b6);color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(49,62,39,.28);z-index:400;display:flex;align-items:center;justify-content:center;transition:transform var(--d1) var(--ease)}
.fab:hover{transform:scale(1.05)}
.fab .i{width:24px;height:24px;stroke-width:1.9}
.fab .i .f,.bolt .i .f{fill:currentColor}
.tab{display:none}

/* lancamento rapido */
.lc-val{width:100%;padding:12px;border:1px solid var(--bd);border-radius:var(--rs);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:32px!important;font-weight:700;letter-spacing:-.03em;text-align:center;outline:none;min-height:64px}
.lc-val:focus{border-color:var(--b5);box-shadow:0 0 0 3px rgba(49,62,39,.12)}
.lc-grid{display:flex;flex-wrap:wrap;gap:8px;max-height:196px;overflow-y:auto;padding:2px;margin-top:10px;overscroll-behavior:contain}
.lc-cat{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px 0 10px;border-radius:999px;border:1px solid var(--bd);background:var(--wh);font-size:13.5px;font-weight:600;color:var(--tx);cursor:pointer;max-width:100%}
.lc-cat .e{font-size:15px;line-height:1}
.lc-cat .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-cat:hover{border-color:var(--b5)}
.lc-cat.on{background:var(--b6);color:#fff;border-color:var(--b6)}
.lc-cat.nova{border-style:dashed;color:var(--t2)}
.lc-nc{display:flex;gap:8px;width:100%}
.lc-nc .inp{flex:1}

/* controle: previsto x realizado */
.ct-hd,.ct-row{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(3,minmax(96px,.7fr));gap:12px;align-items:center;padding:11px 18px}
.ct-hd{background:var(--ap2);border-bottom:1px solid var(--bl);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);padding:9px 18px}
.ct-row{border-bottom:1px solid var(--bl)}
.ct-row:last-child{border-bottom:none}
.ct-hd span:not(:first-child),.ct-v{text-align:right}
.ct-nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;min-width:0}
.ct-nm .ic{width:30px;height:30px;font-size:14px;border-radius:8px}
.ct-nm .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600}
.ct-v.mu{color:var(--t2)}.ct-v.al{color:var(--r6)}.ct-v.ok{color:var(--g6)}.ct-v.ze{color:var(--t3)}
.ct-bar{grid-column:1/-1;height:4px;background:var(--ap);border-radius:4px;overflow:hidden;margin-top:-4px}
.ct-fill{height:100%;border-radius:4px}
.ct-fill.ok{background:var(--b5)}.ct-fill.wn{background:var(--o4)}.ct-fill.bd{background:var(--r5)}
.ct-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;background:var(--ap);color:var(--t2)}
.ct-tag.ex{background:var(--o50);color:var(--o6)}
.lg-item{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 18px;border-bottom:1px solid var(--bl);font-size:13.5px;min-height:58px}
.lg-item:last-child{border-bottom:none}
.lg-dt{font-family:var(--mono);font-size:12px;color:var(--t2);flex-shrink:0;width:44px}
.lg-nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-ob{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-vl{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;margin-left:auto;flex-shrink:0}
.lg-vl.d{color:var(--tx)}.lg-vl.r{color:var(--g6)}
.lg-x{border:none;background:0;color:var(--t3);border-radius:50%;width:40px;height:40px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.lg-x:hover{background:var(--r50);color:var(--r6)}
.lg-x .i{width:17px;height:17px}
.lg-fila{font-size:10px;font-weight:700;color:var(--o6);background:var(--o50);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
.ms-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ms-b{min-height:48px;border-radius:var(--rs);border:1px solid var(--bd);background:var(--wh);font-size:14px;font-weight:600;color:var(--tx);cursor:pointer}
.ms-b:hover{border-color:var(--b5)}
.ms-b.on{background:var(--b6);color:#fff;border-color:var(--b6)}
.ms-b.hj:not(.on){border-color:var(--b5);color:var(--b6);font-weight:700}

/* dividas */
.dv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:14px}
.dv-card{background:var(--wh);border-radius:12px;border:1px solid var(--bl);padding:16px 16px 12px;position:relative;display:flex;flex-direction:column;min-width:0}
.dv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dv-name{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}
.dv-credor{font-size:12px;color:var(--t2);margin-top:2px}
.dv-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--ap);color:var(--t2);flex-shrink:0}
.dv-badge.em-dia{background:var(--b50);color:var(--b6)}.dv-badge.atrasada{background:var(--r50);color:var(--r6)}.dv-badge.radar{background:var(--o50);color:var(--o6)}
.dv-n{display:flex;align-items:flex-start;gap:10px 18px;margin-top:14px}
.dv-n>div{min-width:0;flex-shrink:1}
.dv-n .r{margin-left:auto;text-align:right}
.dv-l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t2)}
.dv-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.dv-v.big{font-size:20px}
.dv-v.al{color:var(--r6)}.dv-v.mu{color:var(--t3)}
.dv-progress{height:6px;background:var(--ap);border-radius:6px;overflow:hidden;margin:12px 0 8px}
.dv-progress-fill{height:100%;border-radius:6px;background:var(--b5)}
.dv-progress-fill.atrasada{background:var(--r5)}.dv-progress-fill.radar{background:var(--o4)}.dv-progress-fill.quitada,.dv-progress-fill.encerrada{background:var(--t4)}
.dv-plano{font-size:12.5px;color:var(--t2);line-height:1.55;margin-bottom:6px}
.dv-plano strong{color:var(--tx);font-weight:600}
.dv-obs{font-size:12.5px;color:var(--t2);line-height:1.5;background:var(--ap2);border-radius:8px;padding:7px 10px;margin:4px 0 6px;overflow-wrap:anywhere}
.dv-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dv-flag{font-size:11px;font-weight:600;background:var(--o50);color:var(--o6);padding:3px 8px;border-radius:6px}
.dv-actions{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:8px}
.dv-btn{min-height:40px;padding:0 14px;border-radius:var(--rs);font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--bd);background:var(--wh);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.dv-btn:hover{border-color:var(--t3)}
.dv-btn-p{flex:1;background:var(--b6);border-color:var(--b6);color:#fff}
.dv-btn-p:hover{background:#26311E;border-color:#26311E}
.dv-btn-p .mono{font-weight:600;opacity:.85}
.dv-btn-s{flex:1}
.dv-btn-resolve{background:var(--b50);border-color:var(--b50);color:var(--b6)}
.dv-btn-edit{background:var(--ap);border-color:var(--ap);color:var(--t2)}
.dv-btn-del{background:var(--r50);border-color:var(--r50);color:var(--r6)}
.dv-more{width:40px;padding:0;margin-left:auto;flex-shrink:0;color:var(--t2)}
.dv-more .i{width:18px;height:18px}
.dv-card .dv-more{margin-left:0}
.dv-sec{display:flex;align-items:center;gap:10px}
.dv-sec .tcb{margin-left:2px}
.dv-hist{width:100%;border-collapse:collapse;font-size:14px}
.dv-hist td{padding:8px 4px;border-bottom:1px solid var(--bl)}
.dv-hist td.r{text-align:right;font-family:var(--mono);font-weight:600}
.dv-hist .dv-btn{min-height:36px;padding:0 12px}
.dv-total{display:none}

/* divergencias */
.dg-item{background:var(--wh);border:1px solid var(--bl);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dg-item.res{opacity:.6}
.dg-tx{flex:1 1 260px;min-width:0}
.dg-tt{font-size:13.5px;font-weight:700;margin-bottom:3px;overflow-wrap:anywhere}
.dg-ds{font-size:13px;color:var(--t2);line-height:1.5;overflow-wrap:anywhere}
.dg-dd{font-family:var(--mono);font-size:11px;color:var(--t3);margin-top:6px;overflow-wrap:anywhere;white-space:pre-wrap}

// Usa o motor (Fin.normalizarDB devolve COPIA normalizada; v1 e migrado). Preserva estado de tela.
function normalizarDB(d){
  var n=Fin.normalizarDB(d);
  ['mo','pg','fD','fR'].forEach(function(k){if(d&&d[k]!=null)n[k]=d[k]});

// Estado de tela nasce em HOJE (antes voltava do armazenamento e o ⚡ lancava no ultimo mes visto)
function estadoTelaHoje(d){
  var a=hojeAno(),anos=Object.keys(d.years).sort();
  if(d.years[a])d.curYear=a;
  else d.curYear=anos.filter(function(x){return x<=a}).pop()||anos[0]||a;
  d.mo=d.curYear===a?hojeMes():(d.curYear<a?11:0);
  if(!d.pg)d.pg='dashboard';if(!d.fD)d.fD='all';if(!d.fR)d.fR='all';
}

      d.filaLanc=fila;d.lancamentos=lanc;

    return d;
  }
  NASCEU_VAZIO=true;   // abriu sem copia local: modelo em branco, nao serve de fonte da verdade
  var n=normalizarDB({versao:2,years:{},dividas:[],divergencias:[]});
  n.years[hojeAno()]=defYear();

}

// Resposta da nuvem no formato v2. Se vier v1 (dividas dentro dos anos), converte aqui.
function nuvemParaV2(r){
  var ys=(r&&r.years)||{},temDivNoAno=Object.keys(ys).some(function(a){return ys[a]&&Array.isArray(ys[a].dividas)});
  if(r&&(r.versao===2||(r.versao==null&&!temDivNoAno&&Array.isArray(r.dividas))))return{years:ys,dividas:r.dividas||[],divergencias:r.divergencias||[],v1:false};
  var m=Fin.migrarV1({years:(r&&r.years)||{}});
  return{years:m.years||{},dividas:m.dividas||[],divergencias:m.divergencias||[],v1:true};
}

function aplicarNuvem(r,silencioso){
  var antes=assinatura();
  var n=nuvemParaV2(r);
  var temDado=contarItens(n)>0;
  if(temDado){
    DB.years=n.years;DB.dividas=n.dividas;DB.divergencias=n.divergencias;
    DB=normalizarDB(DB);
    if(!DB.years[DB.curYear])estadoTelaHoje(DB);
    NASCEU_VAZIO=false;   // agora a copia deste aparelho veio da planilha
  }
  DB.lancamentos=r.lancamentos||[];
  SYNC.baseTs=r.ts||Date.now();
  SYNC.baseHash=r.hash||'';
  SYNC.alterouOffline=false;
  SYNC.pronto=true;
  SYNC.carregouNuvem=true;
  SYNC.baseItens=contarItens(n);
  SYNC.liberouPerda=false;
  NUVEM_PENDENTE=null;
  var depois=assinatura();
  if(n.v1&&temDado){
    // Planilha ainda no formato antigo: converte so aqui e NAO envia sozinho.
    // Fica como alteracao pendente que exige confirmacao (a migracao da producao e controlada).
    SYNC.migracaoPendente=true;SYNC.migracaoOk=false;SYNC.ultimoEnviado='v1:'+(r.hash||'');
  }else{
    SYNC.migracaoPendente=false;SYNC.ultimoEnviado=depois;
  }
  salvarLocal();
  if(!silencioso||antes!==depois)R();
  if(SYNC.migracaoPendente)syncUI('erro','Planilha no formato antigo — toque aqui');
  else syncUI('ok','Sincronizado '+hora());
}

function puxarDaNuvem(silencioso){
  if(!KEY){syncUI('offline','Sem chave — toque para conectar');return Promise.resolve(false)}
  var assin0=assinatura();
  syncUI('enviando','Carregando…');
  return apiGet('load').then(function(r){
    if(!r||!r.ok){syncUI('erro',r&&r.erro==='chave-invalida'?'Chave inválida — toque aqui':'Erro ao carregar');return false}
    // Mexeu no app antes da nuvem responder: nao sobrescreve nada sem perguntar
    if(SYNC.alterouOffline){NUVEM_PENDENTE=r;syncUI('erro','Duas versões — toque aqui');avisarConflito();return false}
    // Mexeu DURANTE a leitura, ou ha envio pendente: esta leitura ja nasceu velha, descarta.
    // O envio pendente leva o baseHash; se a planilha mudou, o conflito aparece no envio.
    if(SYNC.pronto&&(assinatura()!==assin0||SYNC.timer||SYNC.enviando||assinatura()!==SYNC.ultimoEnviado)){
      if(SYNC.migracaoPendente&&!SYNC.migracaoOk)syncUI('erro','Planilha no formato antigo — toque aqui');
      else if(assinatura()!==SYNC.ultimoEnviado&&!SYNC.enviando)agendarEnvio();
      return false;
    }
    aplicarNuvem(r,silencioso);
    return true;
  }).catch(function(){syncUI('offline','Offline — usando cópia local');return false});
}

function sv(){
  salvarLocal();
  if(BOOTANDO||!KEY)return;
  if(assinatura()===SYNC.ultimoEnviado)return;
  if(!SYNC.pronto){SYNC.alterouOffline=true;syncUI('erro','Alterado antes de conectar');return}
  agendarEnvio();
}

function agendarEnvio(){
  if(SYNC.timer)clearTimeout(SYNC.timer);
  if(SYNC.migracaoPendente&&!SYNC.migracaoOk){SYNC.timer=null;syncUI('erro','Planilha no formato antigo — toque aqui');return}
  syncUI('enviando','Alterações pendentes…');
  SYNC.timer=setTimeout(enviarAgora,1500);
}

function enviarAgora(){
  if(SYNC.timer){clearTimeout(SYNC.timer);SYNC.timer=null}
  if(!KEY||!SYNC.pronto)return;
  // modelo em branco nunca vira fonte da verdade, mesmo que algo marque pronto
  if(NASCEU_VAZIO&&!SYNC.carregouNuvem){syncUI('erro','Sem cópia da planilha ainda — não vou gravar');return}
  if(SYNC.migracaoPendente&&!SYNC.migracaoOk){syncUI('erro','Planilha no formato antigo — toque aqui');return}
  if(SYNC.enviando){agendarEnvio();return}
  var a=assinatura();
  if(a===SYNC.ultimoEnviado){syncUI('ok','Sincronizado '+hora());return}
  // Nao deixa uma base encolhida sobrescrever a planilha cheia sem o dono mandar
  var itens=contarItens();
  if(!SYNC.liberouPerda&&SYNC.baseItens>10&&itens<SYNC.baseItens*0.5){
    syncUI('erro','Envio bloqueado — toque aqui');
    avisarPerdaMassiva(itens,SYNC.baseItens);
    return;
  }
  SYNC.enviando=true;
  syncUI('enviando','Salvando na planilha…');
  var extra={baseHash:SYNC.baseHash};
  if(SYNC.liberouPerda)extra.forcarPerda=true;   // so depois de confirmacao explicita no modal
  apiPost('replaceAll',{years:DB.years,dividas:DB.dividas,divergencias:DB.divergencias},extra).then(function(r){
    SYNC.enviando=false;
    if(r&&r.ok){
      // Ids que a planilha gerou (item sem id): adota no DB local sem disparar novo envio
      var semEdicao=assinatura()===a;if(adotarIds(r.idsGerados)&&semEdicao)a=assinatura();
      SYNC.ultimoEnviado=a;SYNC.baseTs=r.ts||Date.now();SYNC.baseHash=r.hash||'';SYNC.baseItens=itens;SYNC.hashServidor='';
      SYNC.liberouPerda=false;SYNC.migracaoPendente=false;SYNC.migracaoOk=false;
      if(assinatura()!==a)agendarEnvio();else syncUI('ok','Salvo '+hora());
    }
    else if(r&&r.erro==='conflito'){NUVEM_PENDENTE=null;SYNC.hashServidor=r.hashServidor||'';syncUI('erro','Conflito — toque aqui');avisarConflito()}
    else if(r&&r.erro==='payload-v1'){syncUI('erro','Planilha recusou o formato antigo');avisar('Envio recusado','A planilha recusou o envio no formato antigo. Recarregue o app.')}
    else if(r&&r.erro==='years-vazio'){syncUI('erro','Envio vazio recusado')}
    else if(r&&r.erro==='perda-em-massa'){
      syncUI('erro','Envio bloqueado — toque aqui');
      avisarPerdaMassiva(Number(r.novos)||itens,Number(r.atuais)||SYNC.baseItens);
    }
    else if(r&&r.erro==='chave-invalida'){syncUI('erro','Chave inválida — toque aqui')}
    else{syncUI('erro','Erro ao salvar — tentando de novo');setTimeout(enviarAgora,15000)}
  }).catch(function(){
    SYNC.enviando=false;
    syncUI('offline','Offline — salvo aqui, envio na fila');
    setTimeout(enviarAgora,20000);
  });
}

// idsGerados:[{lista, ano?, indice, id}]: a planilha deu id a item que foi sem id. Devolve true se adotou algum.
function adotarIds(l){
  var mudou=false;
  (l||[]).forEach(function(g){
    var arr=g.lista==='dividas'?DB.dividas:g.lista==='divergencias'?DB.divergencias:(DB.years[String(g.ano)]||{})[g.lista];
    var it=arr&&arr[g.indice];
    if(it&&!it.id&&g.id){it.id=String(g.id);mudou=true}
  });
  if(mudou)salvarLocal();
  return mudou;
}
// Resumo por ano (contagens e totais em R$) para comparar as duas versoes num conflito.
function resumoBase(b){
  var out={anos:{},nDiv:0,saldoDiv:0},hj=hojeYM(),sd=0;
  Object.keys((b&&b.years)||{}).forEach(function(a){
    var y=b.years[a]||{},sR=0,sD=0,sRe=0;
    (y.renda||[]).forEach(function(it){(it.values||[]).forEach(function(v){sR+=Fin.c(Number(v)||0)})});
    (y.despesas||[]).forEach(function(it){(it.values||[]).forEach(function(v){sD+=Fin.c(Number(v)||0)})});
    (y.reserva||[]).forEach(function(it){(it.values||[]).forEach(function(v){sRe+=Fin.c(Number(v)||0)})});
    out.anos[a]={nR:(y.renda||[]).length,nD:(y.despesas||[]).length,nRe:(y.reserva||[]).length,totR:Fin.r(sR),totD:Fin.r(sD),totRe:Fin.r(sRe)};
  });
  ((b&&b.dividas)||[]).forEach(function(dv){out.nDiv++;if(dv.situacao==='ativa'){try{sd+=Fin.c(Fin.divResumo(dv,hj).saldo)}catch(e){}}});
  out.saldoDiv=Fin.r(sd);
  return out;
}
function celulaResumo(x){
  if(!x)return '<span style="color:var(--t3)">não existe</span>';
  return x.nR+' rendas · <span class="mono">'+fm(x.totR)+'</span><br>'+x.nD+' despesas · <span class="mono">'+fm(x.totD)+'</span><br>'+x.nRe+' reservas · <span class="mono">'+fm(x.totRe)+'</span>';
}
function tabelaComparacao(meu,nuvem){
  var anos={};Object.keys(meu.anos).forEach(function(a){anos[a]=1});if(nuvem)Object.keys(nuvem.anos).forEach(function(a){anos[a]=1});
  var h='<table class="cf-tab"><thead><tr><th>Ano</th><th>Neste aparelho</th><th>Na planilha</th></tr></thead><tbody>';
  Object.keys(anos).sort().forEach(function(a){
    var x=meu.anos[a],y=nuvem?nuvem.anos[a]:null,dif=nuvem&&JSON.stringify(x||null)!==JSON.stringify(y||null);
    h+='<tr'+(dif?' class="cf-dif"':'')+'><td><strong>'+esc(a)+'</strong></td><td>'+celulaResumo(x)+'</td><td>'+(nuvem?celulaResumo(y):'consultando…')+'</td></tr>';
  });
  var dd=nuvem&&(meu.nDiv!==nuvem.nDiv||meu.saldoDiv!==nuvem.saldoDiv);
  h+='<tr'+(dd?' class="cf-dif"':'')+'><td><strong>Dívidas</strong></td><td>'+meu.nDiv+' · saldo <span class="mono">'+fm(meu.saldoDiv)+'</span></td><td>'+(nuvem?nuvem.nDiv+' · saldo <span class="mono">'+fm(nuvem.saldoDiv)+'</span>':'consultando…')+'</td></tr>';
  return h+'</tbody></table>';
}

function avisarConflito(){
  var meu=resumoBase(DB);
  var nuvem=null;
  if(NUVEM_PENDENTE){try{nuvem=resumoBase(nuvemParaV2(NUVEM_PENDENTE))}catch(e){nuvem=null}}
  om('<h3>Duas versões diferentes</h3><p class="ms">A planilha mudou depois que este aparelho carregou — o app deve estar aberto em outro lugar.</p>'+
  '<div class="ins yw"><span class="em">⚠️</span>Escolha qual vale. A outra será <strong>descartada</strong>. Linhas em destaque são diferentes.</div>'+
  '<div id="cfTab">'+tabelaComparacao(meu,nuvem)+'</div>'+
  '<div class="mac"><button class="btn btn-s" onclick="usarDaPlanilha()">Usar a da planilha</button><button class="btn btn-p" onclick="cmo();forcarEnvio()">Manter a deste aparelho</button></div>');
  if(!nuvem&&KEY){
    apiGet('load').then(function(r){
      if(!r||!r.ok)return;
      NUVEM_PENDENTE=r;
      var el=document.getElementById('cfTab');
      if(el)el.innerHTML=tabelaComparacao(resumoBase(DB),resumoBase(nuvemParaV2(r)));
    }).catch(function(){
      var el=document.getElementById('cfTab');
      if(el)el.insertAdjacentHTML('beforeend','<div class="fd-h">Não consegui consultar a planilha agora.</div>');
    });
  }
}
function avisarPerdaMassiva(itens,naPlanilha){
  om('<h3>🛑 Não vou gravar isso</h3><p class="ms">O que está neste aparelho é muito menor do que o que a planilha tem.</p>'+
  '<div class="ins al"><span class="em">🚨</span>Aqui: <strong>'+itens+' itens</strong> · Na planilha: <strong>'+(naPlanilha||SYNC.baseItens)+' itens</strong>. Gravar assim apagaria o resto.</div>'+
  '<div class="fd-h">Se você não apagou nada de propósito, use "Trazer da planilha".</div>'+
  '<div class="mac"><button class="btn btn-p" onclick="cmo();puxarDaPlanilhaForcado()">Trazer da planilha</button><button class="btn btn-d" onclick="liberarPerda()">Gravar assim mesmo</button></div>');
}
// "Trazer da planilha" depois de um bloqueio: aplica a nuvem mesmo com alteracao local pendente
function puxarDaPlanilhaForcado(){
  if(!KEY)return;
  syncUI('enviando','Carregando…');
  apiGet('load').then(function(r){if(r&&r.ok)aplicarNuvem(r);else syncUI('erro','Erro ao carregar')}).catch(function(){syncUI('offline','Offline — usando cópia local')});
}
function liberarPerda(){SYNC.liberouPerda=true;cmo();enviarAgora()}
function usarDaPlanilha(){
  var r=NUVEM_PENDENTE;NUVEM_PENDENTE=null;SYNC.alterouOffline=false;cmo();
  if(r)aplicarNuvem(r);else puxarDaPlanilhaForcado();
}
function forcarEnvio(){
  // Celular novo (abriu sem copia) nunca grava por cima: foi exatamente o apagao de agosto
  if(NASCEU_VAZIO&&!SYNC.carregouNuvem){
    syncUI('erro','Sem cópia da planilha — não vou gravar');
    dlg('Não vou gravar','Este aparelho abriu <strong>sem cópia dos seus dados</strong>. O que está aqui é um modelo em branco e apagaria a planilha.<br><br>Use a versão da planilha.',[{t:'Fechar'},{t:'Usar a da planilha',cls:'btn-p',fn:usarDaPlanilha}]);
    return;
  }
  // A versao da planilha que o dono acabou de ver vira a base: se mudar de novo, novo aviso
  var nv=NUVEM_PENDENTE;
  if(nv){SYNC.baseItens=contarItens(nuvemParaV2(nv));SYNC.carregouNuvem=true}
  var hs=SYNC.hashServidor||(nv&&nv.hash)||'';
  if(hs)SYNC.baseHash=hs;
  if(!SYNC.carregouNuvem||!SYNC.baseHash){
    syncUI('erro','Planilha ainda não lida — não vou gravar');
    dlg('Ainda não li a planilha','Sem uma leitura da planilha não dá para comparar as duas versões. Tente sincronizar de novo quando houver internet.',[{t:'Fechar'}]);
    return;
  }
  // de proposito NAO libera a trava de perda em massa: se a base encolheu pela metade,
  // ele ainda ve os numeros dos dois lados antes de confirmar
  SYNC.pronto=true;SYNC.alterouOffline=false;NUVEM_PENDENTE=null;SYNC.hashServidor='';
  enviarAgora();
}
function avisarMigracao(){
  om('<h3>Planilha no formato antigo</h3><p class="ms">A planilha respondeu no formato v1 (dívidas dentro de cada ano).</p>'+
  '<div class="ins yw"><span class="em">🧭</span>Os dados foram convertidos para o formato novo <strong>só neste aparelho</strong>. Nada foi gravado na planilha.</div>'+
  '<div class="fd-h">A migração da planilha está sendo feita de forma controlada. Só grave daqui se tiver certeza.</div>'+
  '<div class="mac"><button class="btn btn-s" onclick="cmo()">Agora não</button><button class="btn btn-d" onclick="confirmarMigracao()">Gravar formato novo na planilha</button></div>');
}
function confirmarMigracao(){
  confirmar('Gravar o formato novo?','A planilha passa a ter as dívidas no formato novo. Esta ação substitui as abas de planejamento.','Gravar agora',function(){SYNC.migracaoOk=true;enviarAgora()},true);
}

function sincronizarAgora(){
  if(!KEY){pedirChave();return}
  if(SYNC.alterouOffline){avisarConflito();return}
  if(SYNC.migracaoPendente&&!SYNC.migracaoOk){avisarMigracao();return}
  if(!SYNC.pronto){puxarDaNuvem();return}
  if(assinatura()!==SYNC.ultimoEnviado)enviarAgora();else puxarDaNuvem();
}
function pedirChave(){
  om('<h3>Conectar à planilha</h3><p class="ms">Cole a chave de acesso da sua planilha</p>'+
  '<div class="fd"><label>Chave</label><input type="text" id="chIn" placeholder="ex: abcd1234efgh" value="'+esc(KEY)+'" autocomplete="off"></div>'+
  '<div class="fd-h">Sem chave, o app funciona só neste aparelho.</div>'+
  '<div class="mac"><button class="btn btn-s" onclick="cmo()">Cancelar</button><button class="btn btn-p" onclick="salvarChave()">Conectar</button></div>');
  setTimeout(function(){var e=document.getElementById('chIn');if(e)e.focus()},100);
}
function salvarChave(){
  var v=document.getElementById('chIn').value.trim();
  if(!v)return;
  lsSet('key',v);
  KEY=v;cmo();puxarDaNuvem();
}

// Le um valor digitado: aceita virgula ("1.500,50", "1500,5", "1500.50"). Vazio ou invalido = null.
function lerValor(s){
  s=String(s==null?'':s).replace(/R\$/g,'').replace(/\s/g,'');
  if(!s)return null;
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(s.indexOf(',')>=0)s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  if(!/^-?\d+(\.\d+)?$/.test(s))return null;
  var n=Number(s);
  if(!isFinite(n)||n<0)return null;
  return Math.round(n*100)/100;
}

function pgD(m){
  var t=T(m),y=Y(),ym=Fin.ym(DB.curYear,m),pm2=PM(m),c=contagens(),rT=Fin.r(Fin.c(t.renda)+Fin.c(t.sobraAnterior)),s=t.saldo,pct=pctTxt(t.comprometimento),pcd=pctTxt(t.comprometimentoDividas),re=accRe(m),cr=t.sobraAnterior;
  var mAnt=MN[(m+11)%12].toLowerCase(),mProx=MN[(m+1)%12].toLowerCase(),mes=MN[m].toLowerCase();
  // o que precisa de acao: contas sem baixa de meses anteriores, pendentes do mes e parcelas em aberto
  var itens=[],falta=0,nAtr=0;
  for(var mm=0;mm<m;mm++)y.despesas.forEach(function(d){if(stD(d,mm)==='Pendente'){itens.push({h:linhaDesp(d,mm,{atr:1}),o:-1,dia:diaVenc(d.venc)});falta+=Fin.c(d.values[mm]||0);nAtr++}});
  y.despesas.forEach(function(d){if(stD(d,m)==='Pendente'){itens.push({h:linhaDesp(d,m),o:0,dia:diaVenc(d.venc)});falta+=Fin.c(d.values[m]||0)}});
  pm2.forEach(function(p){if(p.status!=='Pago'){itens.push({h:linhaParc(p,ym),o:0,dia:diaVenc(p.venc)});falta+=Math.max(0,Fin.c(p.valor)-Fin.c(p.pago||0))}});
  itens.sort(function(a,b){return a.o-b.o||a.dia-b.dia});
  falta=Fin.r(falta);
  var nf=y.despesas.filter(function(x){return x.tipo==='fixa'&&x.values[m]>0}).length,nv=y.despesas.filter(function(x){return x.tipo==='variavel'&&x.values[m]>0}).length;
  var h='<div class="pg on">'+avisoAnoNovo();
  // painel do mes
  var frase=s>0?'Sobra que passa para '+mProx+'.':s<0?'Faltam <strong>'+fm(-s)+'</strong> para fechar '+mes+'.':'Renda e despesas empatadas em '+mes+'.';
  if(!(t.renda>0))frase+=' <span class="al">Sem renda prevista em '+mes+'.</span>';
  if(t.rendaExtra>0)frase+=' <span class="hx">Sem as entradas extras ('+fm(t.rendaExtra)+'), '+mes+' fecharia em <strong>'+fm(t.resultadoSemExtras)+'</strong>'+(cr!==0?', sem contar a sobra de '+mAnt:'')+'.</span>';
  else if(t.despesas>t.renda)frase+=' <span class="al">Despesas passam a renda do mês em <strong>'+fm(Fin.r(Fin.c(t.despesas)-Fin.c(t.renda)))+'</strong>'+(cr>0&&s>=0?'; a sobra de '+mAnt+' cobre a diferença.':'.')+'</span>';
  var kc=pct>100?'al':pct>85?'wn':'ok';
  h+='<section class="hero" aria-label="Resumo de '+mes+'"><div class="hero-top"><div><div class="eyb">Saldo de '+mes+'</div><div class="hero-v'+(s<0?' neg':s===0?' zero':'')+'">'+fm(s)+'</div><p class="hero-s">'+frase+'</p></div>';
  h+='<div class="hero-k"><div class="kpi"><div class="eyb">Falta pagar</div><span class="kpi-v'+(falta>0?'':' ok')+'">'+fm(falta)+'</span><span class="kpi-s">'+(itens.length?plural(itens.length,'conta'):'Tudo pago')+'</span></div>';
  h+='<div class="kpi"><div class="eyb">Comprometido</div><span class="kpi-v '+kc+'">'+pct.toFixed(0)+'%</span><span class="kpi-s">da renda do mês</span></div></div></div>';
  // regua: quanto da renda (com a sobra) vai para despesas, parcelas e o que sobra
  var base=Math.max(rT,t.despesas,1),wD=Math.max(0,t.despProprias)/base*100,wP=Math.max(0,t.parcelas)/base*100;
  h+='<div class="regua" role="img" aria-label="Despesas '+fm(t.despProprias)+', parcelas '+fm(t.parcelas)+', '+(s>=0?'sobra '+fm(s):'falta '+fm(-s))+'"><i class="rg-d" style="width:'+wD.toFixed(2)+'%"></i><i class="rg-p" style="width:'+wP.toFixed(2)+'%"></i>'+(s<0?'<i class="rg-x" style="position:absolute;right:0;top:0;width:'+(Math.min(100,-s/base*100)).toFixed(2)+'%"></i>':'')+'</div>';
  h+='<div class="regua-l"><span><i class="sw d"></i>Despesas <b>'+fm(t.despProprias)+'</b></span><span><i class="sw p"></i>Parcelas de dívida <b>'+fm(t.parcelas)+'</b></span>'+(s>=0?'<span><i class="sw s"></i>Sobra <b>'+fm(s)+'</b></span>':'<span><i class="sw x"></i>Falta <b>'+fm(-s)+'</b></span>')+'</div>';
  var hs='<div class="stats"><div><div class="sx-l">Renda de '+mes+'</div><div class="sx-v ok">'+fm(t.renda)+'</div><div class="sx-s">'+(t.rendaExtra>0?'inclui '+fm(t.rendaExtra)+' de extras · ':'')+(cr>0?'+ '+fm(cr)+' de '+mAnt:cr<0?fm(cr)+' de '+mAnt:'sem sobra anterior')+'</div></div>';
  hs+='<div><div class="sx-l">Despesas</div><div class="sx-v">'+fm(t.despProprias)+'</div><div class="sx-s">'+nf+' fixas · '+nv+' variáveis</div></div>';
  hs+='<div><div class="sx-l">Parcelas de dívida</div><div class="sx-v">'+fm(t.parcelas)+'</div><div class="sx-s">'+plural(pm2.length,'parcela')+' · '+pcd.toFixed(0)+'% da renda</div></div>';
  hs+='<div><div class="sx-l">Reserva acumulada</div><div class="sx-v">'+fm(re)+'</div><div class="sx-s">até '+SH[m]+'/'+esc(DB.curYear)+'</div></div></div>';
  // no celular o resumo vai para depois do que precisa de acao (a lista aparece sem rolar tanto)
  h+=(mob()?'':hs)+'</section>';
  if(c.at)h+='<div class="ins al"><span class="em">'+svg('clock')+'</span><button class="lk" onclick="gp(\'dividas\')">Ver dívidas</button><strong>'+plural(c.at,'dívida')+'</strong> com parcela vencida sem pagamento.</div>';
  // o que precisa de acao
  h+='<div class="g3"><section class="card"><div class="card-h"><h2>Para pagar'+(itens.length?' <span class="tcb br2">'+itens.length+'</span>':'')+'</h2>'+(itens.length?'<span class="card-m">falta <b>'+fm(falta)+'</b></span>':'')+'</div>';
  if(itens.length)h+='<ul class="lst">'+itens.map(function(x){return x.h}).join('')+'</ul>';
  else h+='<div class="vazio">'+svg('ok')+'<b>Tudo pago em '+mes+'</b>Nenhuma conta ou parcela em aberto.</div>';
  h+='</section>'+(mob()?hs:'')+'<div>';
  // proximo mes
  var mN=(m+1)%12,aN=m===11?String(Number(DB.curYear)+1):DB.curYear,tN=DB.years[aN]?T(mN,aN):null;
  h+='<section class="card"><div class="card-h"><h2>Em '+MN[mN].toLowerCase()+'</h2>'+(tN?'<button class="lk" onclick="nm()">Abrir'+svg('chev')+'</button>':'')+'</div>';
  if(tN)h+='<div class="stats" style="border:0;border-radius:0;margin:0;grid-template-columns:1fr 1fr"><div><div class="sx-l">Previsto</div><div class="sx-v">'+fm(tN.despesas)+'</div><div class="sx-s">'+plural(PM(mN,aN).length,'parcela')+'</div></div><div><div class="sx-l">Saldo previsto</div><div class="sx-v '+(tN.saldo<0?'al':'ok')+'">'+fm(tN.saldo)+'</div><div class="sx-s">com a sobra deste mês</div></div></div>';
  else h+='<div class="vazio" style="padding:22px 18px">'+esc(aN)+' ainda não existe no planejamento.</div>';
  h+='</section>';
  // maiores despesas
  var top=y.despesas.filter(function(x){return x.values[m]>0&&stD(x,m)!=='N/A'}).map(function(x){return{d:x,v:x.values[m]}}).concat(pm2.map(function(p){return{p:p,v:p.valor}}));
  top.sort(function(a,b){return b.v-a.v});
  h+='<section class="card"><div class="card-h"><h2>Maiores despesas</h2><button class="lk" onclick="gp(\'controle\')">Previsto x realizado'+svg('chev')+'</button></div><ul class="lst">';
  top.slice(0,6).forEach(function(it){h+=it.d?linhaDesp(it.d,m,{semFim:1,tipo:1}):linhaParc(it.p,ym,{semFim:1})});
  if(!top.length)h+='<li class="vazio">Nada previsto em '+mes+'.</li>';
  h+='</ul></section></div></div></div>';
  return h;
}

function celStatus(st,v){var sc='st-e',sx='—';if(st==='Pago'){sc='st-p';sx='✓ '+fs(v)}else if(st==='Pendente'){sc='st-pe';sx=fs(v)}else if(st==='Parcial'){sc='st-pa';sx='◐ '+fs(v)}else if(st==='N/A'){sc='st-n';sx='N/A'}else if(v>0){sc='st-e';sx=fs(v)}else{sc='st-e st-z'}return[sc,sx]}
function filtroD(){return '<div class="fpills" role="group" aria-label="Filtrar contas"><button class="fpill '+(DB.fD==='all'?'on':'')+'" onclick="sfD(\'all\')">Todas</button><button class="fpill '+(DB.fD==='fixa'?'on':'')+'" onclick="sfD(\'fixa\')">Fixas</button><button class="fpill '+(DB.fD==='variavel'?'on':'')+'" onclick="sfD(\'variavel\')">Variáveis</button></div>'}
// ===== PLANEJAMENTO =====
function pgP(m){
  if(mob())return pgPMes(m);
  var h='<div class="pg on"><div class="ph"><div class="pt">Planejamento '+esc(DB.curYear)+'<small>Toque no valor para editar. No vermelho, marca como pago.</small></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+filtroD()+'<button class="ab" onclick="addD()">'+svg('plus')+'Nova conta</button></div></div>';
  h+='<div class="tc"><div class="ts"><table class="t yt"><thead><tr><th class="cn">Conta</th><th>Tipo</th><th>Venc.</th>';
  for(var i=0;i<12;i++)h+='<th class="c '+(i===m?'mhh':'')+'">'+SH[i]+'</th>';
  h+='<th class="r tt">Total</th></tr></thead><tbody>';
  function linha(d2){var tot=0,ic=gi(d2.name),et=encTxt(d2);d2.values.forEach(function(v){tot+=Fin.c(v||0)});var r='<tr'+(et?' class="enc"':'')+'><td class="cn"><div class="nm"><span class="ic">'+ic[0]+'</span><span>'+esc(d2.name)+(et?'<small class="enc-t">'+esc(et)+'</small>':'')+'</span></div></td><td><span class="tp '+(d2.tipo==='fixa'?'tp-f':'tp-v')+'">'+(d2.tipo==='fixa'?'Fixa':'Var.')+'</span></td><td class="vc">'+esc(vencTxt(d2.venc)||'—')+'</td>';
    for(var i=0;i<12;i++){var v=d2.values[i],st=stD(d2,i),cs=celStatus(st,v);r+='<td class="c '+(i===m?'mhi':'')+'"><button class="st '+cs[0]+'" data-acao="'+(st==='Pendente'?'qp':'eU')+'" data-id="'+esc(d2.id)+'" data-m="'+i+'" data-flash="d|'+esc(d2.id)+'|'+i+'"'+(st==='Pendente'?' title="Pendente: toque para marcar como pago"':'')+'>'+cs[1]+'</button></td>'}
    return r+'<td class="r tt"><span class="cv b">'+fm(Fin.r(tot))+'</span></td></tr>'}
  var casa=[],div=[],fechadas=[];
  filtD().forEach(function(d2){if(encNoMes(d2,0))fechadas.push(d2);else if(ehDivDesp(d2))div.push(d2);else casa.push(d2)});
  casa.forEach(function(d2){h+=linha(d2)});
  var parc=DB.fD!=='variavel'?parcelasDoAno():[];
  if(div.length||parc.length)h+='<tr class="sep"><td colspan="16">Dívidas e cartões</td></tr>';
  div.forEach(function(d2){h+=linha(d2)});
  parc.forEach(function(g){var tot=0,ic=gi(nomeParc(g.name));h+='<tr class="dv-linha"><td class="cn"><div class="nm"><span class="ic">'+ic[0]+'</span><span>'+esc(nomeParc(g.name))+'</span></div></td><td>'+tagDiv()+'</td><td class="vc">'+esc(vencTxt(g.venc)||'—')+'</td>';
    for(var i=0;i<12;i++){var p=g.meses[i];if(!p){h+='<td class="c '+(i===m?'mhi':'')+'"><span class="cv ze">—</span></td>';continue}tot+=Fin.c(p.valor||0);var cs=celStatus(p.status,p.valor);h+='<td class="c '+(i===m?'mhi':'')+'">'+btnParcela(p,Fin.ym(DB.curYear,i),cs[0],cs[1])+'</td>'}
    h+='<td class="r tt"><span class="cv b">'+fm(Fin.r(tot))+'</span></td></tr>'});
  if(fechadas.length){h+='<tr class="sep"><td colspan="16"><button class="lk" onclick="UI.verEnc=!UI.verEnc;R()">'+(UI.verEnc?'Esconder':'Mostrar')+' '+plural(fechadas.length,'conta encerrada','contas encerradas')+'</button></td></tr>';
    if(UI.verEnc)fechadas.forEach(function(d2){h+=linha(d2)})}
  h+='</tbody></table></div></div></div>';return h}
// Celular: o mes em lista (a grade de 12 meses nao cabe em 390 px)
function pgPMes(m){
  var y=Y(),t=T(m),ym=Fin.ym(DB.curYear,m),mes=MN[m].toLowerCase(),pend=[],resto=[],sem=[],enc=[],dAbe=[],dPag=[],pago=0,falta=0,totDiv=0;
  filtD().forEach(function(d){var st=stD(d,m),v=d.values[m]||0;
    if(encNoMes(d,m)){enc.push(d);return}
    if(ehDivDesp(d)){
      if(!(v>0)||st==='N/A'){sem.push(d);return}
      totDiv+=Fin.c(v);
      if(st==='Pago'){dPag.push({h:linhaDesp(d,m,{tipo:1}),dia:diaVenc(d.venc)});pago+=Fin.c(v)}
      else{dAbe.push({h:linhaDesp(d,m,{tipo:1}),dia:diaVenc(d.venc)});if(st==='Pendente')falta+=Fin.c(v)}
      return}
    if(st==='Pendente'){pend.push({h:linhaDesp(d,m,{tipo:1}),dia:diaVenc(d.venc)});falta+=Fin.c(v)}
    else if(v>0&&st!=='N/A'){resto.push({h:linhaDesp(d,m,{tipo:1}),dia:diaVenc(d.venc)});if(st==='Pago')pago+=Fin.c(v)}
    else sem.push(d)});
  if(DB.fD!=='variavel')PM(m).forEach(function(p){totDiv+=Fin.c(p.valor||0);if(p.status==='Pago'){dPag.push({h:linhaParc(p,ym),dia:diaVenc(p.venc)});pago+=Fin.c(p.pago||p.valor)}else{dAbe.push({h:linhaParc(p,ym),dia:diaVenc(p.venc)});falta+=Math.max(0,Fin.c(p.valor)-Fin.c(p.pago||0));pago+=Fin.c(p.pago||0)}});
  var ord=function(a,b){return a.dia-b.dia};pend.sort(ord);resto.sort(ord);dAbe.sort(ord);dPag.sort(ord);
  var h='<div class="pg on"><div class="ph"><div class="pt">Contas de '+mes+'<small>Planejamento '+esc(DB.curYear)+'</small></div><button class="ab" onclick="addD()">'+svg('plus')+'Nova</button></div>';
  h+='<div class="stats c3"><div><div class="sx-l">Falta pagar</div><div class="sx-v'+(falta>0?' al':' ok')+'">'+fm(Fin.r(falta))+'</div></div><div><div class="sx-l">Pago</div><div class="sx-v">'+fm(Fin.r(pago))+'</div></div><div><div class="sx-l">Previsto no mês</div><div class="sx-v">'+fm(t.despesas)+'</div><div class="sx-s">casa + dívidas</div></div></div>';
  h+='<div style="margin-bottom:14px">'+filtroD()+'</div>';
  h+='<section class="card"><div class="card-h"><h2>Contas da casa</h2><span class="card-m">'+fm(Fin.r(Fin.c(t.despesas)-totDiv))+'</span></div>';
  if(pend.length)h+='<div class="card-h" style="border-top:1px solid var(--bl)"><h2>Para pagar <span class="tcb br2">'+pend.length+'</span></h2></div><ul class="lst">'+pend.map(function(x){return x.h}).join('')+'</ul>';
  if(resto.length)h+='<div class="card-h" style="border-top:1px solid var(--bl)"><h2>Demais contas</h2><span class="card-m">'+plural(resto.length,'conta')+'</span></div><ul class="lst">'+resto.map(function(x){return x.h}).join('')+'</ul>';
  if(!pend.length&&!resto.length)h+='<div class="vazio">'+svg('ok')+'<b>Nada para pagar em '+mes+'</b>Nenhuma conta da casa com valor neste mês.</div>';
  if(sem.length)h+=grp('p-sem','Sem valor em '+mes,plural(sem.length,'conta'),function(){return '<ul class="lst">'+sem.map(function(d){return linhaDesp(d,m,{tipo:1})}).join('')+'</ul>'});
  if(enc.length)h+=grp('p-enc','Encerradas',plural(enc.length,'conta'),function(){return '<ul class="lst">'+enc.map(function(d){return linhaDesp(d,m,{enc:1})}).join('')+'</ul>'});
  h+='</section>';
  if(dAbe.length||dPag.length){
    h+='<section class="card"><div class="card-h"><h2>Dívidas e cartões'+(dAbe.length?' <span class="tcb br2">'+dAbe.length+'</span>':'')+'</h2><span class="card-m">'+fm(Fin.r(totDiv))+' no mês</span></div>';
    if(dAbe.length)h+='<ul class="lst">'+dAbe.map(function(x){return x.h}).join('')+'</ul>';
    else h+='<div class="vazio" style="padding:18px">'+svg('ok')+'<b>Tudo pago</b></div>';
    if(dPag.length)h+=grp('p-div-pagas','Pagas em '+mes,plural(dPag.length,'item','itens'),function(){return '<ul class="lst">'+dPag.map(function(x){return x.h}).join('')+'</ul>'});
    h+='<p class="fd-h" style="margin:0;padding:10px 18px 14px">O plano de cada dívida fica na página Dívidas.</p></section>';
  }
  h+='</div>';
  return h;
}

// ===== RENDA / DESPESAS / RESERVA =====
function filtroTipo(type,fKey,items){var nf=items.filter(function(x){return x.tipo==='fixa'}).length,nv=items.filter(function(x){return x.tipo==='variavel'}).length;
  return '<div class="fpills" role="group" aria-label="Filtrar"><button class="fpill '+(DB[fKey]==='all'?'on':'')+'" onclick="sf(\''+fKey+'\',\'all\')">Todas</button><button class="fpill '+(DB[fKey]==='fixa'?'on':'')+'" onclick="sf(\''+fKey+'\',\'fixa\')">Fixas · '+nf+'</button><button class="fpill '+(DB[fKey]==='variavel'?'on':'')+'" onclick="sf(\''+fKey+'\',\'variavel\')">Variáveis · '+nv+'</button></div>'}
function vTB(type,m,title){
  var items=Y()[type],filt=type==='despesas'?filtD():type==='renda'?filtR():items,hasTipo=type!=='reserva',fKey=type==='despesas'?'fD':'fR',novo={renda:'Nova renda',despesas:'Nova despesa',reserva:'Nova reserva'}[type];
  if(mob())return vTBMes(type,m,title,filt,hasTipo,fKey,novo);
  var h='<div class="pg on"><div class="ph"><div class="pt">'+title+' '+esc(DB.curYear)+'<small>Toque no valor para editar'+(type!=='reserva'?' e no nome para renomear':'')+'.</small></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+(hasTipo?filtroTipo(type,fKey,items):'')+'<button class="ab" onclick="addI(\''+type+'\')">'+svg('plus')+novo+'</button></div></div>';
  h+='<div class="tc"><div class="ts"><table class="t yt"><thead><tr><th class="cn">Categoria</th>'+(hasTipo?'<th>Tipo</th>':'');
  for(var i=0;i<12;i++)h+='<th class="r '+(i===m?'mhh':'')+'">'+SH[i]+'</th>';
  h+='<th class="r tt">Total</th><th class="r tt">Média</th></tr></thead><tbody>';
  var nFech=0;
  if(type==='despesas'){filt=filt.filter(function(it){if(encNoMes(it,0)){nFech++;return !!UI.verEnc}return true})}
  if(type==='renda'){var rg=filt.filter(function(it){return !ehExtra(it)}),ex=filt.filter(ehExtra);filt=rg.concat(ex)}
  var sepX=false;
  filt.forEach(function(it){
    if(type==='renda'&&!sepX&&ehExtra(it)){sepX=true;h+='<tr class="sep"><td colspan="16">Entradas extras</td></tr>'}var tot=0,avg=avgNZ(it.values),ic=gi(it.name);it.values.forEach(function(v){tot+=Fin.c(v||0)});
    h+='<tr><td class="cn"><div class="nm"><span class="ic">'+ic[0]+'</span><span class="rn" data-acao="ren" data-tipo="'+type+'" data-id="'+esc(it.id)+'" title="Renomear">'+esc(it.name)+'</span></div></td>';
    if(hasTipo)h+='<td>'+(type==='renda'&&ehExtra(it)?'<span class="tp tp-x">Extra</span>':'<span class="tp '+(it.tipo==='fixa'?'tp-f':'tp-v')+'">'+(it.tipo==='fixa'?'Fixa':'Var.')+'</span>')+'</td>';
    for(var i=0;i<12;i++){var v=it.values[i],cl=v>0?(type==='renda'?'po':'ne'):'ze',ac=type==='despesas'?'data-acao="eU" data-id="'+esc(it.id)+'" data-m="'+i+'"':'data-acao="eVR" data-tipo="'+type+'" data-id="'+esc(it.id)+'" data-m="'+i+'"';
      h+='<td class="r '+(i===m?'mhi':'')+'"><span class="cv '+cl+'" '+ac+' data-flash="d|'+esc(it.id)+'|'+i+'" role="button" tabindex="0">'+(v>0?fm(v):'—')+'</span></td>'}
    h+='<td class="r tt"><span class="cv b">'+fm(Fin.r(tot))+'</span></td><td class="r tt"><span class="cv ze b">'+fm(avg)+'</span></td></tr>'});
  if(type==='despesas'&&DB.fD!=='variavel')parcelasDoAno().forEach(function(g){var tot=0,n=0,ic=gi(nomeParc(g.name));

var XLSX_P=null;
function carregarXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(XLSX_P)return XLSX_P;
  XLSX_P=new Promise(function(ok,falha){
    var sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.async=true;
    sc.onload=function(){window.XLSX?ok(window.XLSX):falha(new Error('SheetJS indisponível'))};
    sc.onerror=function(){XLSX_P=null;falha(new Error('Sem internet para carregar o leitor de planilhas'))};
    document.head.appendChild(sc);
  });
  return XLSX_P;
}

  };

// ===== STRICT TEMPLATE PARSER =====
var MONTH_NAMES_IDX={
  'janeiro':0,'jan':0,'fevereiro':1,'fev':1,'feb':1,
  'março':2,'marco':2,'mar':2,'abril':3,'abr':3,'apr':3,
  'maio':4,'mai':4,'may':4,'junho':5,'jun':5,'julho':6,'jul':6,
  'agosto':7,'ago':7,'aug':7,'setembro':8,'set':8,'sep':8,
  'outubro':9,'out':9,'oct':9,'novembro':10,'nov':10,'dezembro':11,'dez':11,'dec':11
};

function normStr(s){return String(s||'').toLowerCase().trim().replace(/\s+/g,' ')}
function parseNum(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return isNaN(v)?0:v;
  var s=String(v).trim();
  if(!s)return 0;
  s=s.replace(/R\$/g,'').replace(/\$/g,'').replace(/€/g,'').replace(/\s/g,'');
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(s.indexOf(',')>=0)s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');   // "1.500" e mil e quinhentos, nao 1,5
  var n=parseFloat(s);
  return isNaN(n)?0:Math.abs(n);
}
function getMonthIdx(s){
  var n=normStr(s);
  for(var k in MONTH_NAMES_IDX){
    if(n===k||n.indexOf(k)===0)return MONTH_NAMES_IDX[k];
  }
  return -1;
}
function normalizeTipo(v){
  var n=normStr(v);
  if(n==='fixa'||n==='fixo'||n==='f')return 'fixa';
  if(n==='variável'||n==='variavel'||n==='v'||n==='var'||n==='var.')return 'variavel';
  return 'variavel';
}
function findSheet(wb,names){
  var lower=wb.SheetNames.map(function(s){return normStr(s)});
  for(var i=0;i<names.length;i++){
    var target=normStr(names[i]);
    for(var j=0;j<lower.length;j++){
      if(lower[j]===target||lower[j].indexOf(target)>=0)return wb.SheetNames[j];
    }
  }
  return null;
}

function parseSection(wb,sheetName,type){
  if(!sheetName)return [];
  var ws=wb.Sheets[sheetName];
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  if(!rows||rows.length<2)return [];
  var header=rows[0];
  var nameCol=-1,tipoCol=-1,vencCol=-1;
  var monthCols={};
  header.forEach(function(h,i){
    var n=normStr(h);
    if(n==='nome'||n==='categoria'||n==='descrição'||n==='descricao'||n==='item')nameCol=i;
    else if(n==='tipo')tipoCol=i;
    else if(n.indexOf('venc')>=0)vencCol=i;
    else {
      var m=getMonthIdx(h);
      if(m>=0)monthCols[m]=i;
    }
  });
  if(nameCol<0)nameCol=0;
  if(Object.keys(monthCols).length===0)return [];
  
  var items=[];
  for(var r=1;r<rows.length;r++){
    var row=rows[r];
    if(!row||!row[nameCol])continue;
    var rawName=String(row[nameCol]).trim();
    if(!rawName)continue;
    if(normStr(rawName).indexOf('total')>=0)continue;
    
    var values=z12();
    var hasVal=false;
    for(var m=0;m<12;m++){
      if(monthCols[m]!==undefined){
        var v=parseNum(row[monthCols[m]]);
        if(v>0){values[m]=v;hasVal=true}
      }
    }
    if(!hasVal)continue;
    
    var item={name:rawName,values:values};
    if(type!=='reserva'){
      if(tipoCol>=0)item.tipo=normalizeTipo(row[tipoCol]);
      else item.tipo='variavel';
    }
    if(type==='despesas'){
      item.venc=vencCol>=0?String(row[vencCol]||'').trim():'';
    }
    items.push(item);
  }
  return items;
}

// Valida o esquema de um arquivo importado. Devolve lista de problemas (vazia = ok).
function validarImport(d){
  var er=[];
  if(!d||typeof d!=='object')return['Arquivo não é um objeto JSON.'];
  if(!d.years||typeof d.years!=='object'||Array.isArray(d.years))return['Arquivo sem "years".'];
  var anos=Object.keys(d.years);
  if(!anos.length)er.push('Nenhum ano no arquivo.');
  anos.forEach(function(a){
    if(!/^\d{4}$/.test(a)){er.push('Ano inválido: '+a);return}
    var y=d.years[a];
    if(!y||typeof y!=='object'){er.push(a+': ano vazio');return}
    ['despesas','renda','reserva'].forEach(function(t){
      if(y[t]==null)return;
      if(!Array.isArray(y[t])){er.push(a+': '+t+' não é lista');return}
      y[t].forEach(function(it,i){
        if(!it||typeof it.name!=='string'||!it.name.trim())er.push(a+' '+t+' #'+(i+1)+': sem nome');
        else if(!Array.isArray(it.values)||it.values.length!==12||it.values.some(function(v){return typeof v!=='number'||!isFinite(v)}))er.push(a+' '+t+' "'+it.name+'": valores devem ser 12 números');
      });
    });
  });
  if(d.versao===2){
    if(d.dividas!=null&&!Array.isArray(d.dividas))er.push('"dividas" não é lista');
    else (d.dividas||[]).forEach(function(dv,i){if(!dv||typeof dv.name!=='string'||!(Number(dv.total)>=0))er.push('Dívida #'+(i+1)+': sem nome ou total')});
    if(d.divergencias!=null&&!Array.isArray(d.divergencias))er.push('"divergencias" não é lista');
  }
  return er;
}
function importData(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var data;
    try{data=JSON.parse(e.target.result)}catch(err){avisar('Arquivo inválido','Não é um JSON válido.');return}
    var er=validarImport(data);
    if(er.length){avisar('Arquivo recusado','Nada foi alterado.<br><br>'+er.slice(0,8).map(esc).join('<br>')+(er.length>8?'<br>… e mais '+(er.length-8):''));return}
    // Lancamentos e fila do arquivo sao descartados: realizado vem da planilha
    var novo;
    try{
      if(data.versao===2)novo={years:data.years,dividas:data.dividas||[],divergencias:data.divergencias||[]};
      else{var m=Fin.migrarV1({years:data.years});novo={years:m.years,dividas:m.dividas||[],divergencias:m.divergencias||[]}}
      novo=normalizarDB({versao:2,years:novo.years,dividas:novo.dividas,divergencias:novo.divergencias});
    }catch(err){avisar('Arquivo recusado','Não consegui converter: '+esc(err.message));return}
    var meu=resumoBase(DB),dele=resumoBase(novo);
    om('<h3>Importar backup?</h3><p class="ms">'+(data.versao===2?'Formato novo (v2)':'Formato antigo (v1), convertido para o novo')+' · '+Object.keys(novo.years).sort().map(esc).join(', ')+'</p>'+
      '<div class="ins al"><span class="em">⚠️</span>Isso <strong>substitui</strong> o planejamento e as dívidas atuais. Lançamentos do arquivo são ignorados.</div>'+
      tabelaComparacao(meu,dele).replace('Na planilha','No arquivo')+
      '<div class="fd-h">A gravação na planilha passa pelas mesmas travas (perda em massa e conflito).</div>'+
      '<div class="mac"><button class="btn btn-s" onclick="cmo()">Cancelar</button><button class="btn btn-d" id="impOk">Substituir pelos dados do arquivo</button></div>');
    document.getElementById('impOk').onclick=function(){
      DB.years=novo.years;DB.dividas=novo.dividas;DB.divergencias=novo.divergencias;
      DB=normalizarDB(DB);estadoTelaHoje(DB);
      cmo();toast('Dados importados');R();   // R() -> sv(): envio normal, com as travas
    };
  };
  reader.readAsText(file);
  // Reset input
  document.getElementById('syncFile').value='';
}

var alertShownAt=0;
